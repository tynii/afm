<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>레시피북 발표자료</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<!-- ⚠️ 모든 CDN은 버전을 명시적으로 고정. Babel은 반드시 7.x -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
<!-- Pretendard 1.3.9 (jsdelivr, 버전 고정) -->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css" />
<style>
  html, body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; overscroll-behavior: none; }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(28px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .slide-enter { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  .pop-in { animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
</style>
</head>
<body class="bg-[#F2F4F6]">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ========================================
// 📦 Recipe Data
// ========================================

const RECIPES = [
  {
    id: 'rose-tteokbokki',
    title: '로제떡볶이',

      { title: '떡과 어묵 넣기', time: '4분', desc: '떡과 어묵을 넣고 중불에서 양념이 배도록 저어가며 끓입니다.' },
      { title: '크림 더하기', time: '4분', desc: '우유와 치즈를 넣고 약불로 줄여 걸쭉해질 때까지 졸입니다.' },
      { title: '마무리', time: '2분', desc: '대파를 넣고 한소끔 더 끓인 뒤 그릇에 담아냅니다.' },
    ],
    tip: '매운맛을 줄이려면 고추장 대신 케첩을 섞어보세요.',

  {

    title: '망고 요거트 파르페',
    time: '15분',
    tagline: '불 없이 완성하는 상큼하고 건강한 디저트',

      '블루베리 또는 딸기 약간', '민트잎 약간',
    ],
    steps: [
      { title: '재료 준비', time: '3분', desc: '망고를 사방 1cm로 깍둑썰고 냉동이라면 살짝 해동합니다.' },
      { title: '요거트 섞기', time: '2분', desc: '요거트에 꿀 1/2큰술을 넣고 살살 섞어 단맛을 더합니다.' },
      { title: '첫 번째 층 쌓기', time: '3분', desc: '유리컵 바닥에 그래놀라를 깔고 요거트를 절반 올립니다.' },
      { title: '두 번째 층 쌓기', time: '4분', desc: '망고 절반 올린 뒤 남은 요거트·그래놀라·망고 순으로 쌓습니다.' },
      { title: '마무리', time: '3분', desc: '꿀을 두르고 블루베리와 민트잎으로 장식해 완성합니다.' },
    ],
    tip: '그래놀라는 먹기 직전에 넣어야 바삭한 식감이 살아있어요.',
  },
  {
    id: 'sausage-fried-rice',
    title: '소세지 야채볶음밥',
    time: '15분',
    tagline: '냉장고 속 자투리 야채로 뚝딱 만드는 든든한 한 끼',
    image: '../images/소세지야채볶음밥-썸네일.png',
    accent: '#FF6B4A',
    ingredients: [
      '밥 1공기', '소세지 2개', '양파 1/4개', '당근 1/6개',
      '대파 1/4대', '케첩 2큰술', '간장 1작은술', '소금·후추 약간',
    ],
    steps: [
      { title: '재료 손질', time: '3분', desc: '소세지는 어슷하게 썰고 양파와 당근은 잘게 다져둡니다.' },
      { title: '소세지 굽기', time: '3분', desc: '팬에 소세지를 넣어 겉면이 노릇해질 때까지 볶습니다.' },
      { title: '야채 볶기', time: '3분', desc: '양파와 당근을 넣고 숨이 죽을 때까지 함께 볶아줍니다.' },
      { title: '밥 볶기', time: '4분', desc: '밥을 넣고 강불에서 섞어가며 볶다가 케첩·간장으로 간합니다.' },
      { title: '마무리', time: '2분', desc: '대파를 넣고 소금·후추로 간을 맞춘 뒤 그릇에 담아냅니다.' },
    ],
    tip: '케첩을 먼저 볶아 신맛을 날리면 감칠맛이 더 좋아져요.',
  },
  {
    id: 'avocado-egg-toast',
    title: '아보카도 계란 토스트',
    time: '15분',
    tagline: '부드러운 아보카도와 반숙 계란이 어우러진 브런치',
    image: '../images/아보카도계란토스트-썸네일.png',
    accent: '#FF6B4A',
    ingredients: [
      '식빵 2장', '아보카도 1/2개', '계란 1개', '레몬즙 1작은술',
      '소금·후추 약간', '올리브유 약간', '페퍼론치노(선택)',
    ],
    steps: [
      { title: '식빵 굽기', time: '3분', desc: '토스터나 마른 팬에 식빵을 노릇하게 구워둡니다.' },
      { title: '아보카도 으깨기', time: '3분', desc: '아보카도를 으깬 뒤 레몬즙·소금·후추로 간을 합니다.' },
      { title: '계란 반숙 만들기', time: '5분', desc: '올리브유를 두르고 계란을 반숙 프라이나 수란으로 익힙니다.' },
      { title: '토스트에 올리기', time: '2분', desc: '구운 식빵 위에 으깬 아보카도를 골고루 펴 바릅니다.' },
      { title: '마무리', time: '2분', desc: '반숙 계란을 올리고 소금·후추·페퍼론치노를 뿌려 완성합니다.' },
    ],
    tip: '레몬즙은 아보카도의 갈변을 막아줘요.',
  },
];

const ACCENT = '#FF6B4A';
const ACCENT_LIGHT = '#FFEEE8';

// ========================================
// 🎨 Design System Components
// ========================================

function Button({ children, variant = 'primary', size = 'md', disabled = false, onClick, className = '', ...props }) {
  const base = 'inline-flex items-center justify-center font-bold rounded-full transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-30 disabled:cursor-not-allowed';
  const variants = {
    primary: `text-white shadow-sm hover:shadow-md`,
    secondary: 'bg-white text-[#191F28] border border-[#E5E8EB] hover:bg-[#F9FAFB]',
    ghost: 'bg-white/90 text-[#191F28] hover:bg-white shadow-sm',
  };
  const sizes = {
    sm: 'text-xs px-3 py-1.5 gap-1',
    md: 'text-sm px-4 py-2.5 gap-1.5',
    lg: 'text-base px-6 py-3 gap-2',
  };
  const style = variant === 'primary' ? { backgroundColor: ACCENT, '--tw-ring-color': ACCENT } : {};
  return (
    <button
      disabled={disabled}
      onClick={onClick}
      style={style}
      className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
      {...props}
    >
      {children}
    </button>
  );
}

function Badge({ children, tone = 'accent' }) {
  const tones = {
    accent: { backgroundColor: ACCENT_LIGHT, color: ACCENT },
    dark: { backgroundColor: '#191F28', color: '#fff' },
    gray: { backgroundColor: '#F2F4F6', color: '#8B95A1' },
  };
  return (
    <span
      style={tones[tone]}
      className="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold"
    >
      {children}
    </span>
  );
}

function Card({ children, className = '' }) {
  return (
    <div className={`bg-white rounded-[28px] shadow-[0_8px_30px_rgba(25,31,40,0.06)] ${className}`}>
      {children}
    </div>
  );
}

// ========================================
// 🧩 Deck Chrome (progress bar, nav, dots)
// ========================================

function ProgressBar({ current, total }) {
  return (
    <div className="fixed top-0 left-0 right-0 h-1 bg-[#E5E8EB] z-40">
      <div
        className="h-full transition-all duration-500 ease-out"
        style={{ width: `${((current + 1) / total) * 100}%`, backgroundColor: ACCENT }}
      ></div>
    </div>
  );
}

function NavArrow({ direction, onClick, disabled }) {
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      aria-label={direction === 'prev' ? '이전 슬라이드' : '다음 슬라이드'}
      className="w-11 h-11 sm:w-12 sm:h-12 rounded-full bg-white shadow-[0_4px_16px_rgba(25,31,40,0.1)] flex items-center justify-center text-[#191F28] hover:scale-105 active:scale-95 transition-transform disabled:opacity-30 disabled:pointer-events-none"
    >
      {direction === 'prev' ? '←' : '→'}
    </button>
  );
}

function DeckNav({ current, total, onPrev, onNext, onJump }) {
  return (
    <div className="fixed bottom-5 sm:bottom-8 left-1/2 -translate-x-1/2 z-40 flex items-center gap-3 sm:gap-4 bg-white/90 backdrop-blur-md rounded-full pl-3 pr-3 py-2 shadow-[0_8px_24px_rgba(25,31,40,0.1)]">
      <NavArrow direction="prev" onClick={onPrev} disabled={current === 0} />
      <div className="flex items-center gap-1.5">
        {Array.from({ length: total }).map((_, i) => (
          <button
            key={i}
            onClick={() => onJump(i)}
            aria-label={`${i + 1}번 슬라이드로 이동`}
            className="rounded-full transition-all duration-300"
            style={{
              width: i === current ? '20px' : '6px',
              height: '6px',
              backgroundColor: i === current ? ACCENT : '#E5E8EB',
            }}
          ></button>
        ))}
      </div>
      <NavArrow direction="next" onClick={onNext} disabled={current === total - 1} />
    </div>
  );
}

// ========================================
// 📄 Slide Components
// ========================================

function SlideShell({ children, className = '' }) {
  return (
    <div className={`min-h-screen w-full flex flex-col items-center justify-center px-5 sm:px-10 py-20 ${className}`}>
      <div key={Math.random()} className="slide-enter w-full max-w-5xl">
        {children}
      </div>
    </div>
  );
}

function CoverSlide() {
  return (
    <SlideShell>
      <div className="text-center">
        <div className="flex justify-center gap-3 text-5xl sm:text-6xl mb-6">
          <span className="pop-in" style={{ animationDelay: '0ms' }}>🍲</span>
          <span className="pop-in" style={{ animationDelay: '80ms' }}>🥭</span>
          <span className="pop-in" style={{ animationDelay: '160ms' }}>🍳</span>
          <span className="pop-in" style={{ animationDelay: '240ms' }}>🥑</span>
        </div>
        <Badge tone="accent">이번 주 레시피북</Badge>
        <h1 className="mt-5 text-4xl sm:text-6xl font-black text-[#191F28] tracking-tight leading-[1.15]">
          15분이면 충분해요,<br />오늘 뭐 먹지?
        </h1>
        <p className="mt-5 text-base sm:text-lg text-[#8B95A1] font-medium">
          집에서 바로 따라 만드는 4가지 레시피를 모아봤어요
        </p>
      </div>
    </SlideShell>
  );
}

function StatTile({ number, label }) {
  return (
    <div className="flex-1 min-w-[130px] bg-white rounded-3xl px-5 py-6 text-center shadow-[0_8px_30px_rgba(25,31,40,0.06)]">
      <div className="text-3xl sm:text-4xl font-black" style={{ color: ACCENT }}>{number}</div>
      <div className="mt-1 text-sm font-semibold text-[#8B95A1]">{label}</div>
    </div>
  );
}

function OverviewSlide({ onJump }) {
  return (
    <SlideShell>
      <div className="text-center mb-8">
        <Badge tone="dark">Overview</Badge>
        <h2 className="mt-4 text-3xl sm:text-4xl font-black text-[#191F28] tracking-tight">
          이 안에 담긴 레시피 4가지
        </h2>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 mb-6">
        <StatTile number="4개" label="레시피" />
        <StatTile number="60분" label="총 조리시간" />
        <StatTile number="1인분" label="기준 분량" />
        <StatTile number="하" label="평균 난이도" />
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
        {RECIPES.map((r, i) => (
          <button
            key={r.id}
            onClick={() => onJump(i + 2)}
            className="text-left group"
          >
            <Card className="overflow-hidden group-hover:-translate-y-1 transition-transform duration-200">
              <div className="aspect-square overflow-hidden">
                <img src={r.image} alt={r.title} className="w-full h-full object-cover" />
              </div>
              <div className="p-3 sm:p-4">
                <p className="font-bold text-[#191F28] text-sm leading-snug">{r.title}</p>
                <p className="mt-1 text-xs font-semibold" style={{ color: ACCENT }}>{r.time}</p>
              </div>
            </Card>
          </button>
        ))}
      </div>
    </SlideShell>
  );
}

function RecipeSlide({ recipe, index }) {
  return (
    <SlideShell>
      <Badge tone="gray">RECIPE {String(index + 1).padStart(2, '0')} / 04</Badge>

      <div className="mt-4 grid sm:grid-cols-[minmax(0,340px)_1fr] gap-6 sm:gap-10 items-start">
        <div>
          <div className="rounded-[28px] overflow-hidden shadow-[0_12px_36px_rgba(25,31,40,0.1)]">
            <img src={recipe.image} alt={recipe.title} className="w-full aspect-square object-cover" />
          </div>
          <h2 className="mt-5 text-2xl sm:text-3xl font-black text-[#191F28] tracking-tight">
            {recipe.title}
          </h2>
          <p className="mt-2 text-sm text-[#8B95A1] font-medium leading-relaxed">{recipe.tagline}</p>
          <div className="mt-3 flex gap-2">
            <Badge tone="accent">⏱ {recipe.time}</Badge>
            <Badge tone="gray">1인분</Badge>
          </div>

          <Card className="mt-5 p-5">
            <p className="text-xs font-bold text-[#8B95A1] mb-3">재료</p>
            <div className="flex flex-wrap gap-1.5">
              {recipe.ingredients.map((ing) => (
                <span key={ing} className="text-xs font-medium bg-[#F2F4F6] text-[#4E5968] rounded-full px-2.5 py-1">
                  {ing}
                </span>
              ))}
            </div>
          </Card>
        </div>

        <div>
          <Card className="p-5 sm:p-6">
            <p className="text-xs font-bold text-[#8B95A1] mb-4">만드는 법</p>
            <ol className="space-y-4">
              {recipe.steps.map((step, i) => (
                <li key={i} className="flex gap-3">
                  <span
                    className="flex-shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-xs font-black text-white"
                    style={{ backgroundColor: ACCENT }}
                  >
                    {i + 1}
                  </span>
                  <div className="flex-1 pb-1 border-b border-[#F2F4F6] last:border-0">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="font-bold text-[#191F28] text-sm">{step.title}</span>
                      <span className="text-xs text-[#B0B8C1] font-semibold">{step.time}</span>
                    </div>
                    <p className="mt-1 text-sm text-[#4E5968] leading-relaxed">{step.desc}</p>
                  </div>
                </li>
              ))}
            </ol>
          </Card>

          <div
            className="mt-4 rounded-2xl px-5 py-4 flex items-start gap-2.5"
            style={{ backgroundColor: ACCENT_LIGHT }}
          >
            <span className="text-lg leading-none">💡</span>
            <p className="text-sm font-medium leading-relaxed" style={{ color: '#B8471F' }}>{recipe.tip}</p>
          </div>
        </div>
      </div>
    </SlideShell>
  );
}

function ClosingSlide() {
  return (
    <SlideShell>
      <div className="text-center">
        <div className="flex justify-center gap-2 text-5xl mb-6">
          {RECIPES.map((r, i) => (
            <span key={r.id} className="pop-in" style={{ animationDelay: `${i * 80}ms` }}>
              {['🍲', '🥭', '🍳', '🥑'][i]}
            </span>
          ))}
        </div>
        <h2 className="text-3xl sm:text-5xl font-black text-[#191F28] tracking-tight leading-tight">
          오늘은 뭘 만들어볼까요?
        </h2>
        <p className="mt-4 text-base sm:text-lg text-[#8B95A1] font-medium">
          4가지 레시피 중 하나를 골라 지금 바로 시작해보세요
        </p>
        <div className="mt-8">
          <Badge tone="accent">Thank you 🍽</Badge>
        </div>
      </div>
    </SlideShell>
  );
}

// ========================================
// 🚀 App / Deck Controller
// ========================================

function App() {
  const slides = [
    <CoverSlide key="cover" />,
    null, // placeholder for overview, injected below with onJump
    ...RECIPES.map((r, i) => <RecipeSlide key={r.id} recipe={r} index={i} />),
    <ClosingSlide key="closing" />,
  ];
  const total = slides.length;
  const [current, setCurrent] = useState(0);

  const goTo = useCallback((idx) => {
    setCurrent(Math.max(0, Math.min(total - 1, idx)));
  }, [total]);

  useEffect(() => {
    const handleKey = (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') goTo(current + 1);
      if (e.key === 'ArrowLeft') goTo(current - 1);
    };
    window.addEventListener('keydown', handleKey);
    return () => window.removeEventListener('keydown', handleKey);
  }, [current, goTo]);

  slides[1] = <OverviewSlide key="overview" onJump={goTo} />;

  return (
    <div className="relative">
      <ProgressBar current={current} total={total} />
      {slides[current]}
      <DeckNav current={current} total={total} onPrev={() => goTo(current - 1)} onNext={() => goTo(current + 1)} onJump={goTo} />
    </div>
  );
}

// ========================================
// Rendering
// ========================================
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
