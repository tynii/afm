<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR 코드 생성기</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
  <style>
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fade-in 0.25s ease-out; }
  </style>
</head>
<body class="bg-slate-50">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, className = '', children, type = 'button' }) {
      const base = 'inline-flex items-center justify-center font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed';
      const variants = {
        primary: 'bg-indigo-600 text-white hover:bg-indigo-700 focus:ring-indigo-500',
        secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 focus:ring-indigo-500',
        danger: 'bg-red-600 text-white hover:bg-red-700 focus:ring-red-500',
        ghost: 'bg-transparent text-slate-600 hover:bg-slate-100 focus:ring-slate-400',
      };
      const sizes = {
        sm: 'px-3 py-1.5 text-sm',
        md: 'px-4 py-2 text-sm',
        lg: 'px-5 py-2.5 text-base',
      };
      return (
        <button
          type={type}
          disabled={disabled}
          onClick={onClick}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Input({ label, value, onChange, placeholder, type = 'text', error, disabled = false, id }) {
      const inputId = id || `input-${label}`;
      return (
        <div className="w-full">
          {label && (
            <label htmlFor={inputId} className="block text-sm font-medium text-slate-700 mb-1">
              {label}
            </label>
          )}
          <input
            id={inputId}
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            disabled={disabled}
            className={`w-full px-3 py-2 border rounded-lg text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 disabled:bg-slate-100 ${
              error ? 'border-red-400' : 'border-slate-300'
            }`}
          />
          {error && <p className="mt-1 text-xs text-red-600">{error}</p>}
        </div>
      );
    }

    function Card({ children, className = '' }) {
      return (
        <div className={`bg-white rounded-2xl shadow-sm border border-slate-200 p-6 ${className}`}>
          {children}
        </div>
      );
    }

    function Select({ label, value, onChange, options, id }) {
      const selectId = id || `select-${label}`;
      return (
        <div className="w-full">
          {label && (
            <label htmlFor={selectId} className="block text-sm font-medium text-slate-700 mb-1">
              {label}
            </label>
          )}
          <select
            id={selectId}
            value={value}
            onChange={onChange}
            className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm text-slate-900 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
          >
            {options.map((opt) => (
              <option key={opt.value} value={opt.value}>{opt.label}</option>
            ))}
          </select>
        </div>
      );
    }

    function Badge({ children, tone = 'slate' }) {
      const tones = {
        slate: 'bg-slate-100 text-slate-700',
        green: 'bg-green-100 text-green-700',
        red: 'bg-red-100 text-red-700',
      };
      return (
        <span className={`inline-block px-2 py-0.5 rounded-full text-xs font-medium ${tones[tone]}`}>
          {children}
        </span>
      );
    }

    // ========================================
    // 📄 Page Components
    // ========================================

    const ERROR_LEVELS = [
      { value: 'L', label: 'L (7% 복원)' },
      { value: 'M', label: 'M (15% 복원)' },
      { value: 'Q', label: 'Q (25% 복원)' },
      { value: 'H', label: 'H (30% 복원)' },
    ];

    const SIZE_OPTIONS = [
      { value: '200', label: '작게 (200px)' },
      { value: '320', label: '보통 (320px)' },
      { value: '480', label: '크게 (480px)' },
    ];

    function QrGeneratorPage() {
      const [text, setText] = useState('https://www.anthropic.com');
      const [errorLevel, setErrorLevel] = useState('M');
      const [size, setSize] = useState('320');
      const [fgColor, setFgColor] = useState('#1e1b4b');
      const [bgColor, setBgColor] = useState('#ffffff');
      const [error, setError] = useState('');
      const [copied, setCopied] = useState(false);
      const canvasRef = useRef(null);

      const generate = useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        if (!text.trim()) {
          setError('QR 코드로 만들 텍스트나 URL을 입력해주세요.');
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          return;
        }

        try {
          new QRious({
            element: canvas,
            value: text,
            size: Number(size),
            level: errorLevel,
            foreground: fgColor,
            background: bgColor,
            padding: 16,
          });
          setError('');
        } catch (e) {
          setError('QR 코드 생성에 실패했습니다. 입력값을 확인해주세요.');
        }
      }, [text, errorLevel, size, fgColor, bgColor]);

      useEffect(() => {
        generate();
      }, [generate]);

      const handleDownload = () => {
        const canvas = canvasRef.current;
        if (!canvas || error) return;
        const link = document.createElement('a');
        link.download = 'qrcode.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      };

      const handleCopyLink = async () => {
        if (!text.trim()) return;
        try {
          await navigator.clipboard.writeText(text);
          setCopied(true);
          setTimeout(() => setCopied(false), 1500);
        } catch (e) {
          setError('클립보드 복사에 실패했습니다.');
        }
      };

      return (
        <div className="min-h-screen flex flex-col items-center px-4 py-10 sm:py-16">
          <div className="w-full max-w-3xl">
            <header className="text-center mb-8">
              <h1 className="text-2xl sm:text-3xl font-bold text-slate-900">QR 코드 생성기</h1>
              <p className="mt-2 text-sm sm:text-base text-slate-500">
                텍스트나 URL을 입력하면 즉시 QR 코드를 만들어드려요.
              </p>
            </header>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <Card className="flex flex-col gap-5">
                <Input
                  label="텍스트 / URL"
                  value={text}
                  onChange={(e) => setText(e.target.value)}
                  placeholder="예: https://example.com"
                  error={error}
                />

                <div className="grid grid-cols-2 gap-4">
                  <Select
                    label="오류 복원 수준"
                    value={errorLevel}
                    onChange={(e) => setErrorLevel(e.target.value)}
                    options={ERROR_LEVELS}
                  />
                  <Select
                    label="크기"
                    value={size}
                    onChange={(e) => setSize(e.target.value)}
                    options={SIZE_OPTIONS}
                  />
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label htmlFor="fg-color" className="block text-sm font-medium text-slate-700 mb-1">
                      전경색
                    </label>
                    <div className="flex items-center gap-2">
                      <input
                        id="fg-color"
                        type="color"
                        value={fgColor}
                        onChange={(e) => setFgColor(e.target.value)}
                        className="h-9 w-12 rounded border border-slate-300 cursor-pointer"
                      />
                      <span className="text-xs text-slate-500">{fgColor}</span>
                    </div>
                  </div>
                  <div>
                    <label htmlFor="bg-color" className="block text-sm font-medium text-slate-700 mb-1">
                      배경색
                    </label>
                    <div className="flex items-center gap-2">
                      <input
                        id="bg-color"
                        type="color"
                        value={bgColor}
                        onChange={(e) => setBgColor(e.target.value)}
                        className="h-9 w-12 rounded border border-slate-300 cursor-pointer"
                      />
                      <span className="text-xs text-slate-500">{bgColor}</span>
                    </div>
                  </div>
                </div>

                <div className="flex flex-wrap gap-3 pt-2">
                  <Button variant="primary" onClick={handleDownload} disabled={!!error || !text.trim()}>
                    PNG로 다운로드
                  </Button>
                  <Button variant="secondary" onClick={handleCopyLink} disabled={!text.trim()}>
                    {copied ? '복사됨!' : '텍스트 복사'}
                  </Button>
                </div>
              </Card>

              <Card className="flex flex-col items-center justify-center gap-4">
                <div className="flex items-center justify-center w-full min-h-[280px]">
                  {error ? (
                    <div className="text-center text-slate-400 animate-fade-in">
                      <svg className="mx-auto mb-2 w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                      </svg>
                      <p className="text-sm">{error}</p>
                    </div>
                  ) : (
                    <canvas ref={canvasRef} className="rounded-lg shadow-sm animate-fade-in" role="img" aria-label="생성된 QR 코드" />
                  )}
                </div>
                <Badge tone={error ? 'red' : 'green'}>
                  {error ? '생성 실패' : '실시간 미리보기'}
                </Badge>
              </Card>
            </div>

            <p className="mt-8 text-center text-xs text-slate-400">
              QR 코드는 브라우저에서 직접 생성되며 어떤 서버로도 전송되지 않습니다.
            </p>
          </div>
        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      return <QrGeneratorPage />;
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
