<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부가가치세 계산기</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
<style>
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }
</style>
</head>
<body class="bg-slate-50 min-h-screen">
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

// ========================================
// Utilities
// ========================================
const VAT_RATE = 0.1;

function formatWon(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return '0';
  return Math.round(n).toLocaleString('ko-KR');
}

function parseWon(str) {
  const digits = str.replace(/[^0-9]/g, '');
  return digits === '' ? 0 : parseInt(digits, 10);
}

function calcFromSupply(supply) {
  const vat = Math.round(supply * VAT_RATE);
  return { supply, vat, total: supply + vat };
}

function calcFromTotal(total) {
  const supply = Math.round(total / (1 + VAT_RATE));
  const vat = total - supply;
  return { supply, vat, total };
}

// ========================================
// 🎨 Design System Components
// ========================================
function Card({ children, className = '' }) {
  return (
    <div className={`bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-6 ${className}`}>
      {children}
    </div>
  );
}

function Button({ children, variant = 'primary', size = 'md', className = '', ...props }) {
  const base = 'inline-flex items-center justify-center font-medium rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-offset-2';
  const variants = {
    primary: 'bg-indigo-600 text-white hover:bg-indigo-700 focus:ring-indigo-500',
    secondary: 'bg-slate-100 text-slate-700 hover:bg-slate-200 focus:ring-slate-400',
    ghost: 'bg-transparent text-slate-500 hover:bg-slate-100 focus:ring-slate-300',
  };
  const sizes = { sm: 'text-sm px-3 py-1.5', md: 'text-sm px-4 py-2', lg: 'text-base px-5 py-2.5' };
  return (
    <button className={`${base} ${variants[variant]} ${sizes[size]} ${className}`} {...props}>
      {children}
    </button>
  );
}

function MoneyInput({ label, value, onChange, placeholder = '0' }) {
  return (
    <div>
      {label && <label className="block text-sm font-medium text-slate-700 mb-1.5">{label}</label>}
      <div className="relative">
        <input
          type="text"
          inputMode="numeric"
          value={value === 0 ? '' : formatWon(value)}
          onChange={(e) => onChange(parseWon(e.target.value))}
          placeholder={placeholder}
          aria-label={label}
          className="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 pr-10 text-right text-lg font-semibold text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100"
        />
        <span className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-sm text-slate-400">원</span>
      </div>
    </div>
  );
}

function SegmentedControl({ options, value, onChange }) {
  return (
    <div className="inline-flex rounded-lg bg-slate-100 p-1" role="tablist">
      {options.map((opt) => (
        <button
          key={opt.value}
          role="tab"
          aria-selected={value === opt.value}
          onClick={() => onChange(opt.value)}
          className={`px-3 py-1.5 text-sm font-medium rounded-md transition-colors ${
            value === opt.value ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'
          }`}
        >
          {opt.label}
        </button>
      ))}
    </div>
  );
}

function ResultRow({ label, value, highlight = false }) {
  return (
    <div className={`flex items-center justify-between py-3 ${highlight ? '' : 'border-b border-slate-100 last:border-0'}`}>
      <span className={highlight ? 'text-base font-semibold text-slate-900' : 'text-sm text-slate-500'}>{label}</span>
      <span className={highlight ? 'text-xl font-bold text-indigo-600' : 'text-base font-medium text-slate-800'}>
        {formatWon(value)}원
      </span>
    </div>
  );
}

function Tabs({ tabs, active, onChange }) {
  return (
    <div className="flex gap-1 border-b border-slate-200">
      {tabs.map((t) => (
        <button
          key={t.value}
          onClick={() => onChange(t.value)}
          className={`px-4 py-2.5 text-sm font-semibold border-b-2 -mb-px transition-colors ${
            active === t.value
              ? 'border-indigo-600 text-indigo-600'
              : 'border-transparent text-slate-400 hover:text-slate-600'
          }`}
        >
          {t.label}
        </button>
      ))}
    </div>
  );
}

// ========================================
// 🧩 Common/Layout Components
// ========================================
function Header() {
  return (
    <header className="mb-6 text-center">
      <h1 className="text-2xl sm:text-3xl font-bold text-slate-900">부가가치세 계산기</h1>
      <p className="mt-1.5 text-sm text-slate-500">공급가액 · 부가세 · 합계금액을 간편하게 계산해보세요</p>
    </header>
  );
}

function Footer() {
  return (
    <footer className="mt-10 text-center text-xs text-slate-400">
      부가세율 {(VAT_RATE * 100).toFixed(0)}% 기준 · 실제 세무 신고 시에는 세무 전문가와 상담하세요
    </footer>
  );
}

// ========================================
// 📄 Page Components
// ========================================
function SingleCalcTab() {
  const [mode, setMode] = useState('supply');
  const [amount, setAmount] = useState(0);

  const result = useMemo(
    () => (mode === 'supply' ? calcFromSupply(amount) : calcFromTotal(amount)),
    [mode, amount]
  );

  return (
    <div className="space-y-5">
      <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <span className="text-sm font-medium text-slate-700">입력 기준</span>
        <SegmentedControl
          value={mode}
          onChange={(v) => { setMode(v); setAmount(0); }}
          options={[
            { value: 'supply', label: '공급가액 입력' },
            { value: 'total', label: '합계금액(세금포함) 입력' },
          ]}
        />
      </div>

      <MoneyInput
        label={mode === 'supply' ? '공급가액' : '합계금액 (부가세 포함)'}
        value={amount}
        onChange={setAmount}
        placeholder="금액을 입력하세요"
      />

      <Card className="bg-slate-50 border-slate-100">
        <ResultRow label="공급가액" value={result.supply} />
        <ResultRow label="부가가치세 (10%)" value={result.vat} />
        <ResultRow label="합계금액" value={result.total} highlight />
      </Card>
    </div>
  );
}

function SettlementTab() {
  const [salesMode, setSalesMode] = useState('total');
  const [sales, setSales] = useState(0);
  const [purchaseMode, setPurchaseMode] = useState('total');
  const [purchase, setPurchase] = useState(0);

  const salesResult = useMemo(
    () => (salesMode === 'supply' ? calcFromSupply(sales) : calcFromTotal(sales)),
    [salesMode, sales]
  );
  const purchaseResult = useMemo(
    () => (purchaseMode === 'supply' ? calcFromSupply(purchase) : calcFromTotal(purchase)),
    [purchaseMode, purchase]
  );

  const payable = salesResult.vat - purchaseResult.vat;

  return (
    <div className="space-y-6">
      <div className="space-y-3">
        <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <span className="text-sm font-semibold text-slate-800">매출 금액</span>
          <SegmentedControl
            value={salesMode}
            onChange={(v) => { setSalesMode(v); setSales(0); }}
            options={[
              { value: 'total', label: '세금포함' },
              { value: 'supply', label: '공급가액' },
            ]}
          />
        </div>
        <MoneyInput value={sales} onChange={setSales} placeholder="매출 금액을 입력하세요" />
      </div>

      <div className="space-y-3">
        <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <span className="text-sm font-semibold text-slate-800">매입 금액</span>
          <SegmentedControl
            value={purchaseMode}
            onChange={(v) => { setPurchaseMode(v); setPurchase(0); }}
            options={[
              { value: 'total', label: '세금포함' },
              { value: 'supply', label: '공급가액' },
            ]}
          />
        </div>
        <MoneyInput value={purchase} onChange={setPurchase} placeholder="매입 금액을 입력하세요" />
      </div>

      <Card className="bg-slate-50 border-slate-100">
        <ResultRow label="매출세액" value={salesResult.vat} />
        <ResultRow label="매입세액" value={purchaseResult.vat} />
        <ResultRow
          label={payable >= 0 ? '납부세액' : '환급세액'}
          value={Math.abs(payable)}
          highlight
        />
      </Card>
    </div>
  );
}

function VatCalculatorPage() {
  const [tab, setTab] = useState('single');

  return (
    <div className="mx-auto max-w-lg px-4 py-10 sm:py-14">
      <Header />
      <Card>
        <Tabs
          tabs={[
            { value: 'single', label: '부가세 계산' },
            { value: 'settlement', label: '납부(환급)세액 계산' },
          ]}
          active={tab}
          onChange={setTab}
        />
        <div className="pt-5">
          {tab === 'single' ? <SingleCalcTab /> : <SettlementTab />}
        </div>
      </Card>
      <Footer />
    </div>
  );
}

// ========================================
// 🚀 App Component
// ========================================
function App() {
  return <VatCalculatorPage />;
}

// ========================================
// Rendering
// ========================================
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
