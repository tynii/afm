<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>짤 생성기</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    .checker-bg {
      background-image:
        linear-gradient(45deg, #e5e7eb 25%, transparent 25%),
        linear-gradient(-45deg, #e5e7eb 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e5e7eb 75%),
        linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
    .text-layer {
      user-select: none;
      cursor: grab;
      touch-action: none;
    }
    .text-layer.dragging {
      cursor: grabbing;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled, onClick, className = '', children, type = 'button' }) {
      const base = 'inline-flex items-center justify-center gap-1.5 font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-1 disabled:opacity-50 disabled:cursor-not-allowed';
      const variants = {
        primary: 'bg-indigo-600 text-white hover:bg-indigo-700 focus:ring-indigo-500',
        secondary: 'bg-white text-gray-700 border border-gray-300 hover:bg-gray-50 focus:ring-gray-300',
        danger: 'bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 focus:ring-red-400',
        ghost: 'bg-transparent text-gray-600 hover:bg-gray-100 focus:ring-gray-300',
      };
      const sizes = { sm: 'text-xs px-2.5 py-1.5', md: 'text-sm px-4 py-2', lg: 'text-base px-5 py-2.5' };
      return (
        <button
          type={type}
          disabled={disabled}
          onClick={onClick}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Card({ className = '', children }) {
      return (
        <div className={`bg-white rounded-xl shadow-sm border border-gray-200 ${className}`}>
          {children}
        </div>
      );
    }

    function Label({ children }) {
      return <label className="block text-xs font-semibold text-gray-500 mb-1">{children}</label>;
    }

    function Slider({ label, min, max, step = 1, value, onChange, unit = '' }) {
      return (
        <div>
          <div className="flex items-center justify-between mb-1">
            <Label>{label}</Label>
            <span className="text-xs text-gray-400">{value}{unit}</span>
          </div>
          <input
            type="range"
            min={min}
            max={max}
            step={step}
            value={value}
            onChange={(e) => onChange(Number(e.target.value))}
            className="w-full accent-indigo-600"
          />
        </div>
      );
    }

    function ColorSwatch({ value, onChange }) {
      return (
        <input
          type="color"
          value={value}
          onChange={(e) => onChange(e.target.value)}
          className="w-9 h-9 rounded-lg border border-gray-300 cursor-pointer bg-white p-0.5"
        />
      );
    }

    // ========================================
    // 🧩 Common Components
    // ========================================
    function Header() {
      return (
        <header className="bg-white border-b border-gray-200">
          <div className="max-w-6xl mx-auto px-4 py-4 flex items-center gap-2">
            <span className="text-2xl">🖼️</span>
            <div>
              <h1 className="text-lg font-bold text-gray-900">짤 생성기</h1>
              <p className="text-xs text-gray-400">이미지 위에 텍스트를 배치하고 이미지로 다운로드하세요</p>
            </div>
          </div>
        </header>
      );
    }

    function EmptyState({ onPick }) {
      const inputRef = useRef(null);
      const [dragOver, setDragOver] = useState(false);

      const handleFiles = (files) => {
        const file = files && files[0];
        if (file && file.type.startsWith('image/')) onPick(file);
      };

      return (
        <div
          onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
          onDragLeave={() => setDragOver(false)}
          onDrop={(e) => { e.preventDefault(); setDragOver(false); handleFiles(e.dataTransfer.files); }}
          className={`flex flex-col items-center justify-center text-center border-2 border-dashed rounded-2xl py-20 px-6 transition-colors ${dragOver ? 'border-indigo-400 bg-indigo-50' : 'border-gray-300 bg-white'}`}
        >
          <span className="text-5xl mb-4">📷</span>
          <p className="text-gray-700 font-medium mb-1">이미지를 여기에 드래그하거나</p>
          <p className="text-gray-400 text-sm mb-5">클릭해서 파일을 선택하세요</p>
          <Button onClick={() => inputRef.current?.click()}>이미지 선택</Button>
          <input
            ref={inputRef}
            type="file"
            accept="image/*"
            className="hidden"
            onChange={(e) => handleFiles(e.target.files)}
          />
        </div>
      );
    }

    // ========================================
    // 📄 Page: Meme Editor
    // ========================================
    const FONTS = [
      { label: '임팩트 (밈 클래식)', value: 'Impact, "Arial Black", sans-serif' },
      { label: '고딕 (Arial)', value: 'Arial, sans-serif' },
      { label: '명조 (Georgia)', value: 'Georgia, serif' },
    ];

    let layerIdCounter = 1;

    function createLayer(text, yPct) {
      return {
        id: layerIdCounter++,
        text,
        xPct: 50,
        yPct,
        fontSize: 44,
        color: '#ffffff',
        strokeColor: '#000000',
        strokeWidth: 6,
        fontFamily: FONTS[0].value,
      };
    }

    function MemeEditor({ image, onReset }) {
      const [layers, setLayers] = useState(() => [
        createLayer('상단 텍스트', 10),
        createLayer('하단 텍스트', 88),
      ]);
      const [selectedId, setSelectedId] = useState(null);
      const [canvasSize, setCanvasSize] = useState({ width: 0, height: 0 });
      const [error, setError] = useState('');
      const stageRef = useRef(null);
      const canvasRef = useRef(null);
      const dragState = useRef(null);

      useEffect(() => {
        const maxW = 640;
        const scale = Math.min(1, maxW / image.width);
        setCanvasSize({ width: Math.round(image.width * scale), height: Math.round(image.height * scale) });
      }, [image]);

      const selectedLayer = layers.find((l) => l.id === selectedId) || null;

      const updateLayer = (id, patch) => {
        setLayers((prev) => prev.map((l) => (l.id === id ? { ...l, ...patch } : l)));
      };

      const addLayer = () => {
        const layer = createLayer('새 텍스트', 50);
        setLayers((prev) => [...prev, layer]);
        setSelectedId(layer.id);
      };

      const removeLayer = (id) => {
        setLayers((prev) => prev.filter((l) => l.id !== id));
        setSelectedId((cur) => (cur === id ? null : cur));
      };

      const onPointerDown = (e, id) => {
        e.preventDefault();
        setSelectedId(id);
        const stage = stageRef.current.getBoundingClientRect();
        dragState.current = { id, stageRect: stage };
        e.target.setPointerCapture?.(e.pointerId);
      };

      const onPointerMove = (e) => {
        if (!dragState.current) return;
        const { id, stageRect } = dragState.current;
        let xPct = ((e.clientX - stageRect.left) / stageRect.width) * 100;
        let yPct = ((e.clientY - stageRect.top) / stageRect.height) * 100;
        xPct = Math.min(100, Math.max(0, xPct));
        yPct = Math.min(100, Math.max(0, yPct));
        updateLayer(id, { xPct, yPct });
      };

      const onPointerUp = () => {
        dragState.current = null;
      };

      const drawToCanvas = useCallback((targetWidth) => {
        const canvas = document.createElement('canvas');
        canvas.width = targetWidth;
        canvas.height = Math.round((image.height / image.width) * targetWidth);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
        const scaleFactor = canvas.width / canvasSize.width;

        layers.forEach((layer) => {
          if (!layer.text.trim()) return;
          const fontSize = layer.fontSize * scaleFactor;
          ctx.font = `bold ${fontSize}px ${layer.fontFamily}`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.lineJoin = 'round';
          const x = (layer.xPct / 100) * canvas.width;
          const y = (layer.yPct / 100) * canvas.height;
          if (layer.strokeWidth > 0) {
            ctx.lineWidth = layer.strokeWidth * scaleFactor;
            ctx.strokeStyle = layer.strokeColor;
            ctx.strokeText(layer.text, x, y);
          }
          ctx.fillStyle = layer.color;
          ctx.fillText(layer.text, x, y);
        });
        return canvas;
      }, [image, layers, canvasSize]);

      const handleDownload = () => {
        if (!canvasSize.width) return;
        try {
          const canvas = drawToCanvas(image.width);
          const url = canvas.toDataURL('image/png');
          const a = document.createElement('a');
          a.href = url;
          a.download = 'meme.png';
          a.click();
          setError('');
        } catch (err) {
          setError('이미지 다운로드 중 문제가 발생했어요. 다른 이미지로 시도해 보세요.');
        }
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div className="lg:col-span-2">
            <Card className="p-4">
              <div
                ref={stageRef}
                onPointerMove={onPointerMove}
                onPointerUp={onPointerUp}
                onPointerLeave={onPointerUp}
                className="relative mx-auto checker-bg rounded-lg overflow-hidden select-none"
                style={{ width: canvasSize.width || '100%', height: canvasSize.height || 400, maxWidth: '100%' }}
              >
                {canvasSize.width > 0 && (
                  <img
                    src={image.src}
                    alt="업로드한 이미지"
                    className="absolute inset-0 w-full h-full object-fill pointer-events-none"
                    draggable={false}
                  />
                )}
                {layers.map((layer) => (
                  <div
                    key={layer.id}
                    onPointerDown={(e) => onPointerDown(e, layer.id)}
                    onClick={() => setSelectedId(layer.id)}
                    className={`text-layer absolute font-bold whitespace-nowrap px-1 ${selectedId === layer.id ? 'outline outline-2 outline-indigo-400 outline-dashed' : ''}`}
                    style={{
                      left: `${layer.xPct}%`,
                      top: `${layer.yPct}%`,
                      transform: 'translate(-50%, -50%)',
                      fontFamily: layer.fontFamily,
                      fontSize: `${layer.fontSize}px`,
                      color: layer.color,
                      WebkitTextStroke: `${layer.strokeWidth}px ${layer.strokeColor}`,
                      paintOrder: 'stroke fill',
                    }}
                  >
                    {layer.text || '(빈 텍스트)'}
                  </div>
                ))}
              </div>
              <p className="text-center text-xs text-gray-400 mt-3">텍스트를 드래그해서 원하는 위치로 옮기세요</p>
              {error && <p className="text-center text-xs text-red-500 mt-2">{error}</p>}
              <div className="flex justify-center gap-2 mt-4">
                <Button variant="secondary" onClick={onReset}>다른 이미지 선택</Button>
                <Button onClick={handleDownload} disabled={!canvasSize.width}>PNG로 다운로드</Button>
              </div>
            </Card>
          </div>

          <div className="space-y-4">
            <Card className="p-4">
              <div className="flex items-center justify-between mb-3">
                <h2 className="font-semibold text-gray-800 text-sm">텍스트 레이어</h2>
                <Button size="sm" variant="ghost" onClick={addLayer}>+ 추가</Button>
              </div>
              <div className="space-y-1.5 max-h-40 overflow-y-auto">
                {layers.length === 0 && (
                  <p className="text-xs text-gray-400 text-center py-3">텍스트가 없어요. "+ 추가"를 눌러보세요.</p>
                )}
                {layers.map((layer) => (
                  <div
                    key={layer.id}
                    onClick={() => setSelectedId(layer.id)}
                    className={`flex items-center justify-between px-3 py-2 rounded-lg cursor-pointer text-sm border ${selectedId === layer.id ? 'border-indigo-400 bg-indigo-50 text-indigo-700' : 'border-transparent hover:bg-gray-50 text-gray-600'}`}
                  >
                    <span className="truncate">{layer.text || '(빈 텍스트)'}</span>
                    <button
                      onClick={(e) => { e.stopPropagation(); removeLayer(layer.id); }}
                      className="text-gray-300 hover:text-red-500 ml-2 shrink-0"
                      aria-label="레이어 삭제"
                    >
                      ✕
                    </button>
                  </div>
                ))}
              </div>
            </Card>

            {selectedLayer ? (
              <Card className="p-4 space-y-4">
                <div>
                  <Label>텍스트 내용</Label>
                  <input
                    type="text"
                    value={selectedLayer.text}
                    onChange={(e) => updateLayer(selectedLayer.id, { text: e.target.value })}
                    className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                    placeholder="텍스트를 입력하세요"
                  />
                </div>

                <div>
                  <Label>폰트</Label>
                  <select
                    value={selectedLayer.fontFamily}
                    onChange={(e) => updateLayer(selectedLayer.id, { fontFamily: e.target.value })}
                    className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                  >
                    {FONTS.map((f) => (
                      <option key={f.value} value={f.value}>{f.label}</option>
                    ))}
                  </select>
                </div>

                <Slider label="글자 크기" min={12} max={100} value={selectedLayer.fontSize} unit="px" onChange={(v) => updateLayer(selectedLayer.id, { fontSize: v })} />
                <Slider label="외곽선 두께" min={0} max={16} value={selectedLayer.strokeWidth} unit="px" onChange={(v) => updateLayer(selectedLayer.id, { strokeWidth: v })} />

                <div className="flex items-center gap-6">
                  <div>
                    <Label>글자 색</Label>
                    <ColorSwatch value={selectedLayer.color} onChange={(v) => updateLayer(selectedLayer.id, { color: v })} />
                  </div>
                  <div>
                    <Label>외곽선 색</Label>
                    <ColorSwatch value={selectedLayer.strokeColor} onChange={(v) => updateLayer(selectedLayer.id, { strokeColor: v })} />
                  </div>
                </div>

                <Button variant="danger" size="sm" className="w-full" onClick={() => removeLayer(selectedLayer.id)}>
                  이 레이어 삭제
                </Button>
              </Card>
            ) : (
              <Card className="p-4">
                <p className="text-sm text-gray-400 text-center py-2">위 목록에서 텍스트 레이어를 선택하면<br />세부 옵션을 편집할 수 있어요.</p>
              </Card>
            )}
          </div>
        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================
    function App() {
      const [image, setImage] = useState(null);
      const [loadError, setLoadError] = useState('');

      const handlePick = (file) => {
        setLoadError('');
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => setImage(img);
        img.onerror = () => setLoadError('이미지를 불러오지 못했어요. 다른 파일을 시도해 주세요.');
        img.src = url;
      };

      const handleReset = () => {
        setImage(null);
        setLoadError('');
      };

      return (
        <div className="min-h-screen">
          <Header />
          <main className="max-w-6xl mx-auto px-4 py-8">
            {!image ? (
              <div>
                <EmptyState onPick={handlePick} />
                {loadError && <p className="text-center text-sm text-red-500 mt-3">{loadError}</p>}
              </div>
            ) : (
              <MemeEditor image={image} onReset={handleReset} />
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
