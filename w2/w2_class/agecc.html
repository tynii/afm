<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국 만나이 계산기</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.25s ease-out; }
  body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
</style>
</head>
<body class="bg-slate-50 min-h-screen">
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useCallback } = React;

// ========================================
// 🎨 Design System Components
// ========================================
function Card({ children, className = "" }) {
  return (
    <div className={`bg-white rounded-2xl shadow-md p-6 sm:p-8 ${className}`}>
      {children}
    </div>
  );
}

function Input({ label, type = "text", value, onChange, placeholder, error, min, max, className = "" }) {
  return (
    <div className={className}>
      {label && (
        <label className="block text-sm font-medium text-slate-700 mb-1.5">
          {label}
        </label>
      )}
      <input
        type={type}
        value={value}
        onChange={onChange}
        placeholder={placeholder}
        min={min}
        max={max}
        aria-invalid={!!error}
        className={`w-full rounded-lg border px-3.5 py-2.5 text-slate-900 placeholder-slate-400 outline-none transition
          focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400
          ${error ? "border-red-400" : "border-slate-300"}`}
      />
      {error && <p className="mt-1.5 text-sm text-red-500">{error}</p>}
    </div>
  );
}

function Button({ children, variant = "primary", size = "md", disabled, onClick, type = "button", className = "" }) {
  const base = "inline-flex items-center justify-center font-medium rounded-lg transition focus:outline-none focus:ring-2 focus:ring-offset-1 disabled:opacity-50 disabled:cursor-not-allowed";
  const variants = {
    primary: "bg-indigo-600 text-white hover:bg-indigo-700 focus:ring-indigo-400",
    secondary: "bg-slate-100 text-slate-700 hover:bg-slate-200 focus:ring-slate-300",
    ghost: "bg-transparent text-indigo-600 hover:bg-indigo-50 focus:ring-indigo-300",
  };
  const sizes = {
    sm: "px-3 py-1.5 text-sm",
    md: "px-4 py-2.5 text-base",
    lg: "px-6 py-3 text-lg",
  };
  return (
    <button
      type={type}
      disabled={disabled}
      onClick={onClick}
      className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
    >
      {children}
    </button>
  );
}

function Badge({ children, color = "indigo" }) {
  const colors = {
    indigo: "bg-indigo-100 text-indigo-700",
    amber: "bg-amber-100 text-amber-700",
    emerald: "bg-emerald-100 text-emerald-700",
  };
  return (
    <span className={`inline-block px-2.5 py-1 rounded-full text-xs font-semibold ${colors[color]}`}>
      {children}
    </span>
  );
}

// ========================================
// 🧮 Age Calculation Logic
// ========================================
function parseDate(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + "T00:00:00");
  return isNaN(d.getTime()) ? null : d;
}

function calcAges(birthDate, baseDate) {
  const by = birthDate.getFullYear();
  const bm = birthDate.getMonth();
  const bd = birthDate.getDate();
  const ry = baseDate.getFullYear();
  const rm = baseDate.getMonth();
  const rd = baseDate.getDate();

  // 만나이: 생일이 지났으면 (오늘연도 - 출생연도), 아니면 -1
  let manAge = ry - by;
  const birthdayPassed = rm > bm || (rm === bm && rd >= bd);
  if (!birthdayPassed) manAge -= 1;

  // 연 나이(세는나이 폐지 후 통용되는 "연 나이", 병역/청소년보호법 등에서 쓰는 방식): 그냥 (오늘연도 - 출생연도)
  const yearAge = ry - by;

  // 세는나이(전통 나이, 출생 시 1세 + 매년 1월 1일 +1): 참고용
  const koreanTraditionalAge = ry - by + 1;

  // 다음 생일까지 남은 일수 계산
  let nextBirthday = new Date(ry, bm, bd);
  if (nextBirthday.getTime() < baseDate.getTime()) {
    nextBirthday = new Date(ry + 1, bm, bd);
  }
  const msPerDay = 1000 * 60 * 60 * 24;
  const daysToNextBirthday = Math.round((nextBirthday.getTime() - baseDate.getTime()) / msPerDay);

  return { manAge, yearAge, koreanTraditionalAge, birthdayPassed, daysToNextBirthday, nextBirthday };
}

function formatDateKr(date) {
  return `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일`;
}

// ========================================
// 📄 Page Component
// ========================================
function AgeCalculatorPage() {
  const todayStr = new Date().toISOString().slice(0, 10);
  const [birthInput, setBirthInput] = useState("");
  const [baseInput, setBaseInput] = useState(todayStr);
  const [error, setError] = useState("");

  const handleBirthChange = useCallback((e) => {
    setBirthInput(e.target.value);
    setError("");
  }, []);

  const handleBaseChange = useCallback((e) => {
    setBaseInput(e.target.value);
    setError("");
  }, []);

  const result = useMemo(() => {
    if (!birthInput) return null;
    const birthDate = parseDate(birthInput);
    const baseDate = parseDate(baseInput || todayStr);
    if (!birthDate || !baseDate) return null;
    if (birthDate.getTime() > baseDate.getTime()) return null;
    return calcAges(birthDate, baseDate);
  }, [birthInput, baseInput, todayStr]);

  const validationError = useMemo(() => {
    if (!birthInput) return "";
    const birthDate = parseDate(birthInput);
    const baseDate = parseDate(baseInput || todayStr);
    if (!birthDate) return "올바른 생년월일을 입력해주세요.";
    if (baseDate && birthDate.getTime() > baseDate.getTime()) return "생년월일이 기준일보다 이후일 수 없습니다.";
    return "";
  }, [birthInput, baseInput, todayStr]);

  const handleReset = useCallback(() => {
    setBirthInput("");
    setBaseInput(todayStr);
    setError("");
  }, [todayStr]);

  return (
    <div className="min-h-screen flex flex-col items-center px-4 py-10 sm:py-16">
      <div className="w-full max-w-md">
        <header className="text-center mb-8">
          <h1 className="text-2xl sm:text-3xl font-bold text-slate-900">🎂 한국 만나이 계산기</h1>
          <p className="mt-2 text-sm text-slate-500">
            2023년 6월 시행된 &ldquo;만 나이&rdquo; 계산 기준으로 나이를 계산합니다.
          </p>
        </header>

        <Card>
          <div className="space-y-5">
            <Input
              label="생년월일"
              type="date"
              value={birthInput}
              onChange={handleBirthChange}
              max={todayStr}
              error={validationError}
            />
            <Input
              label="기준일 (기본값: 오늘)"
              type="date"
              value={baseInput}
              onChange={handleBaseChange}
            />

            <div className="flex gap-2 pt-1">
              <Button variant="secondary" className="flex-1" onClick={handleReset}>
                초기화
              </Button>
            </div>
          </div>
        </Card>

        {result && !validationError && (
          <div className="mt-6 space-y-4 fade-in">
            <Card className="text-center bg-gradient-to-br from-indigo-600 to-indigo-500 !shadow-lg">
              <p className="text-indigo-100 text-sm font-medium">만 나이</p>
              <p className="text-white text-5xl font-bold mt-1">
                {result.manAge}<span className="text-2xl font-medium ml-1">세</span>
              </p>
              <div className="mt-3">
                <Badge color={result.birthdayPassed ? "emerald" : "amber"}>
                  {result.birthdayPassed ? "올해 생일이 지났습니다" : "올해 생일이 아직 지나지 않았습니다"}
                </Badge>
              </div>
            </Card>

            <Card>
              <dl className="grid grid-cols-2 gap-4 text-center">
                <div>
                  <dt className="text-xs text-slate-500">연 나이 (일부 법령 기준)</dt>
                  <dd className="text-xl font-semibold text-slate-800 mt-1">{result.yearAge}세</dd>
                </div>
                <div>
                  <dt className="text-xs text-slate-500">세는나이 (전통 나이, 참고용)</dt>
                  <dd className="text-xl font-semibold text-slate-800 mt-1">{result.koreanTraditionalAge}세</dd>
                </div>
              </dl>
              <div className="mt-5 pt-5 border-t border-slate-100 text-center">
                <p className="text-sm text-slate-500">
                  다음 생일 ({formatDateKr(result.nextBirthday)})까지
                </p>
                <p className="text-lg font-semibold text-indigo-600 mt-0.5">
                  {result.daysToNextBirthday === 0 ? "오늘입니다! 🎉" : `${result.daysToNextBirthday}일 남음`}
                </p>
              </div>
            </Card>
          </div>
        )}

        {!birthInput && (
          <p className="mt-6 text-center text-sm text-slate-400">
            생년월일을 입력하면 결과가 여기에 표시됩니다.
          </p>
        )}
      </div>
    </div>
  );
}

// ========================================
// 🚀 App Component
// ========================================
function App() {
  return <AgeCalculatorPage />;
}

// ========================================
// Rendering
// ========================================
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
