<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>살까말까 커뮤니티</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    .clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const TOKEN_KEY = 'shoppingCommunityToken';
    const CATEGORIES = ['전자기기', '패션/잡화', '가구/생활', '취미/굿즈', '기타'];

    function formatDate(iso) {
      return new Date(iso).toLocaleString('ko-KR', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit',
      });
    }

    // 토큰을 붙여서 API 호출. 401이면 onUnauthorized로 로그아웃 처리
    async function api(url, { method = 'GET', body, token, onUnauthorized } = {}) {
      const res = await fetch(url, {
        method,
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
        },
        body: body ? JSON.stringify(body) : undefined,
      });
      const json = await res.json();
      if (res.status === 401 && token && onUnauthorized) onUnauthorized();
      if (!json.success) throw new Error(json.message || '요청에 실패했습니다');
      return json.data;
    }

    // ── 로그인 / 회원가입 화면 ─────
    function AuthScreen({ onAuth }) {
      const [mode, setMode] = useState('login'); // 'login' | 'signup'
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState('');

      const submit = async (e) => {
        e.preventDefault();
        setBusy(true);
        setError('');
        try {
          const data = await api(`/api/auth/${mode}`, { method: 'POST', body: { username, password } });
          onAuth(data.token, data.user);
        } catch (err) {
          setError(err.message);
        } finally {
          setBusy(false);
        }
      };

      const fillTest = () => {
        setMode('login');
        setUsername('test1');
        setPassword('test1234');
      };

      return (
        <div className="max-w-sm mx-auto px-4 py-16">
          <h1 className="text-2xl font-bold text-slate-800 mb-1">🛍️ 살까말까 커뮤니티</h1>
          <p className="text-sm text-slate-400 mb-6">살까 말까 고민될 때, 같이 고민해요.</p>

          <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <div className="flex mb-5 bg-slate-100 rounded-lg p-1">
              {[['login', '로그인'], ['signup', '회원가입']].map(([m, label]) => (
                <button
                  key={m}
                  type="button"
                  onClick={() => { setMode(m); setError(''); }}
                  className={`flex-1 py-1.5 rounded-md text-sm font-medium ${
                    mode === m ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500'
                  }`}
                >
                  {label}
                </button>
              ))}
            </div>

            <form onSubmit={submit} className="space-y-3">
              <input
                value={username}
                onChange={(e) => setUsername(e.target.value)}
                placeholder="아이디"
                autoComplete="username"
                className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
              />
              <input
                type="password"
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                placeholder="비밀번호"
                autoComplete={mode === 'login' ? 'current-password' : 'new-password'}
                className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
              />
              {mode === 'signup' && (
                <p className="text-xs text-slate-400">아이디 2~20자(한글/영문/숫자/_), 비밀번호 4자 이상. 아이디가 작성자 이름으로 표시돼요.</p>
              )}
              {error && <div className="bg-red-50 text-red-600 text-sm rounded-lg px-3 py-2">{error}</div>}
              <button
                type="submit"
                disabled={busy || !username.trim() || !password}
                className="w-full bg-indigo-600 text-white rounded-lg py-2 text-sm font-medium disabled:opacity-40"
              >
                {busy ? '처리 중...' : mode === 'login' ? '로그인' : '가입하고 시작하기'}
              </button>
            </form>

            <button type="button" onClick={fillTest} className="mt-4 w-full text-xs text-slate-400 hover:text-indigo-600">
              테스트 계정 채우기 (test1 / test1234)
            </button>
          </div>
        </div>
      );
    }

    // ── 카테고리 선택 ─────
    function CategorySelect({ value, onChange }) {
      return (
        <select
          value={value}
          onChange={(e) => onChange(e.target.value)}
          className="border border-slate-200 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-300"
        >
          <option value="">카테고리 선택</option>
          {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
        </select>
      );
    }

    // ── 글쓰기 폼 ─────
    function PostForm({ onSubmit, defaultCategory }) {
      const [category, setCategory] = useState(defaultCategory || '');
      const [title, setTitle] = useState('');
      const [content, setContent] = useState('');
      const [saving, setSaving] = useState(false);
      const [error, setError] = useState('');

      const submit = async (e) => {
        e.preventDefault();
        setSaving(true);
        setError('');
        try {
          await onSubmit(category, title, content);
          setTitle('');
          setContent('');
        } catch (err) {
          setError(err.message);
        } finally {
          setSaving(false);
        }
      };

      return (
        <form onSubmit={submit} className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 mb-6 space-y-2">
          <div className="flex gap-2">
            <CategorySelect value={category} onChange={setCategory} />
            <input
              value={title}
              onChange={(e) => setTitle(e.target.value)}
              maxLength={100}
              placeholder="제목 (예: 이 에어프라이어 살까요?)"
              className="flex-1 min-w-0 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
            />
          </div>
          <textarea
            value={content}
            onChange={(e) => setContent(e.target.value)}
            rows={3}
            placeholder="어떤 물건인지, 왜 고민되는지 적어주세요"
            className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-indigo-300"
          />
          {error && <div className="text-red-600 text-sm">{error}</div>}
          <div className="flex justify-end">
            <button
              type="submit"
              disabled={saving || !category || !title.trim() || !content.trim()}
              className="bg-indigo-600 text-white rounded-lg px-4 py-1.5 text-sm font-medium disabled:opacity-40"
            >
              {saving ? '등록 중...' : '글쓰기'}
            </button>
          </div>
        </form>
      );
    }

    // ── 댓글 (게시글이 펼쳐졌을 때만 불러옴) ─────
    function CommentSection({ postId, call, onCountChange }) {
      const [comments, setComments] = useState(null);
      const [text, setText] = useState('');
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState('');

      const load = useCallback(async () => {
        try {
          const list = await call(`/api/posts/${postId}/comments`);
          setComments(list);
          onCountChange(list.length);
        } catch (err) {
          setError(err.message);
        }
      }, [postId, call]);

      useEffect(() => { load(); }, [postId]);

      const submit = async (e) => {
        e.preventDefault();
        setBusy(true);
        setError('');
        try {
          await call(`/api/posts/${postId}/comments`, { method: 'POST', body: { content: text } });
          setText('');
          await load();
        } catch (err) {
          setError(err.message);
        } finally {
          setBusy(false);
        }
      };

      const remove = async (id) => {
        if (!window.confirm('댓글을 삭제할까요?')) return;
        try {
          await call(`/api/comments/${id}`, { method: 'DELETE' });
          await load();
        } catch (err) {
          setError(err.message);
        }
      };

      return (
        <div className="mt-3 pt-3 border-t border-slate-100">
          {comments === null ? (
            <p className="text-xs text-slate-400">댓글 불러오는 중...</p>
          ) : comments.length === 0 ? (
            <p className="text-xs text-slate-400 mb-2">아직 댓글이 없어요. 첫 의견을 남겨보세요!</p>
          ) : (
            <ul className="space-y-2 mb-3">
              {comments.map((c) => (
                <li key={c.id} className="bg-slate-50 rounded-lg px-3 py-2">
                  <div className="flex items-center justify-between text-xs text-slate-400 mb-0.5">
                    <span>
                      <span className="font-medium text-slate-500">{c.author}</span>
                      {c.mine && <span className="ml-1 text-indigo-500">(나)</span>}
                      <span className="mx-1">·</span>
                      {formatDate(c.created_at)}
                    </span>
                    {c.mine && (
                      <button onClick={() => remove(c.id)} className="hover:text-red-600">삭제</button>
                    )}
                  </div>
                  <p className="text-sm text-slate-700 whitespace-pre-wrap break-words">{c.content}</p>
                </li>
              ))}
            </ul>
          )}
          <form onSubmit={submit} className="flex gap-2">
            <input
              value={text}
              onChange={(e) => setText(e.target.value)}
              maxLength={500}
              placeholder="댓글을 입력하세요"
              className="flex-1 min-w-0 border border-slate-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
            />
            <button
              type="submit"
              disabled={busy || !text.trim()}
              className="bg-indigo-600 text-white rounded-lg px-3 py-1.5 text-sm disabled:opacity-40"
            >
              등록
            </button>
          </form>
          {error && <div className="text-red-600 text-xs mt-1">{error}</div>}
        </div>
      );
    }

    // ── 게시글 카드 (접힘: 내용 2줄까지, 클릭하면 펼침 + 댓글) ─────
    function PostCard({ post, expanded, call, onToggle, onEdit, onDelete, onLike, onCommentCount }) {
      const [editing, setEditing] = useState(false);
      const [category, setCategory] = useState(post.category);
      const [title, setTitle] = useState(post.title);
      const [content, setContent] = useState(post.content);
      const [saving, setSaving] = useState(false);
      const [error, setError] = useState('');

      const startEdit = () => {
        setCategory(post.category);
        setTitle(post.title);
        setContent(post.content);
        setError('');
        setEditing(true);
      };

      const save = async () => {
        setSaving(true);
        setError('');
        try {
          await onEdit(post.id, category, title, content);
          setEditing(false);
        } catch (err) {
          setError(err.message);
        } finally {
          setSaving(false);
        }
      };

      const remove = async () => {
        if (!window.confirm('이 글을 삭제할까요?')) return;
        try {
          await onDelete(post.id);
        } catch (err) {
          setError(err.message);
        }
      };

      const like = async () => {
        try {
          await onLike(post.id);
        } catch (err) {
          setError(err.message);
        }
      };

      if (editing) {
        return (
          <div className="bg-white rounded-2xl shadow-sm border border-indigo-200 p-4 space-y-2">
            <div className="flex gap-2">
              <CategorySelect value={category} onChange={setCategory} />
              <input
                value={title}
                onChange={(e) => setTitle(e.target.value)}
                maxLength={100}
                className="flex-1 min-w-0 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
              />
            </div>
            <textarea
              value={content}
              onChange={(e) => setContent(e.target.value)}
              rows={4}
              className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-indigo-300"
            />
            {error && <div className="text-red-600 text-sm">{error}</div>}
            <div className="flex justify-end gap-2">
              <button onClick={() => setEditing(false)} className="px-3 py-1.5 rounded-lg text-sm text-slate-500 border border-slate-200">
                취소
              </button>
              <button
                onClick={save}
                disabled={saving || !category || !title.trim() || !content.trim()}
                className="px-3 py-1.5 rounded-lg text-sm bg-indigo-600 text-white disabled:opacity-40"
              >
                {saving ? '저장 중...' : '저장'}
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
          <div onClick={() => onToggle(post.id)} className="cursor-pointer">
            <div className="flex items-center gap-2 mb-1">
              <span className="text-xs px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-100 shrink-0">
                {post.category}
              </span>
              <h3 className="font-semibold text-slate-800 truncate">{post.title}</h3>
            </div>
            <div className="text-xs text-slate-400 mb-2">
              <span className="font-medium text-slate-500">{post.author}</span>
              {post.mine && <span className="ml-1 text-indigo-500">(나)</span>}
              <span className="mx-1">·</span>
              {formatDate(post.created_at)}
            </div>
            <p className={`text-sm text-slate-600 whitespace-pre-wrap break-words ${expanded ? '' : 'clamp-2'}`}>
              {post.content}
            </p>
          </div>

          <div className="flex items-center justify-between mt-3 text-xs">
            <div className="flex items-center gap-2">
              <button
                onClick={like}
                className={`px-2.5 py-1 rounded-full border ${
                  post.liked ? 'bg-rose-50 text-rose-600 border-rose-200' : 'bg-white text-slate-500 border-slate-200'
                }`}
              >
                {post.liked ? '❤️' : '🤍'} 공감 {post.like_count}
              </button>
              <button
                onClick={() => onToggle(post.id)}
                className="px-2.5 py-1 rounded-full border bg-white text-slate-500 border-slate-200"
              >
                💬 댓글 {post.comment_count}
              </button>
            </div>
            {post.mine && (
              <div className="flex gap-3">
                <button onClick={startEdit} className="text-slate-500 hover:text-indigo-600">수정</button>
                <button onClick={remove} className="text-slate-500 hover:text-red-600">삭제</button>
              </div>
            )}
          </div>

          {error && <div className="text-red-600 text-sm mt-2">{error}</div>}
          {expanded && (
            <CommentSection postId={post.id} call={call} onCountChange={(n) => onCommentCount(post.id, n)} />
          )}
        </div>
      );
    }

    // ── 앱 ─────
    function App() {
      const [token, setToken] = useState(() => {
        try { return localStorage.getItem(TOKEN_KEY) || ''; } catch { return ''; }
      });
      const [user, setUser] = useState(null);
      const [checking, setChecking] = useState(!!token);
      const [posts, setPosts] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [expandedIds, setExpandedIds] = useState(() => new Set());
      const [view, setView] = useState('home'); // 'home' | 'mypage'
      const [categoryFilter, setCategoryFilter] = useState('');

      const logout = useCallback(() => {
        try { localStorage.removeItem(TOKEN_KEY); } catch {}
        setToken('');
        setUser(null);
        setPosts([]);
        setView('home');
        setCategoryFilter('');
      }, []);

      const call = useCallback(
        (url, opts = {}) => api(url, { ...opts, token, onUnauthorized: logout }),
        [token, logout]
      );

      const handleAuth = (newToken, newUser) => {
        try { localStorage.setItem(TOKEN_KEY, newToken); } catch {}
        setToken(newToken);
        setUser(newUser);
      };

      // 저장된 토큰이 유효한지 확인
      useEffect(() => {
        if (!token || user) { setChecking(false); return; }
        api('/api/auth/me', { token })
          .then(setUser)
          .catch(logout)
          .finally(() => setChecking(false));
      }, [token]);

      const fetchPosts = useCallback(async () => {
        setLoading(true);
        setError('');
        try {
          setPosts(await call('/api/posts'));
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      }, [call]);

      useEffect(() => {
        if (user) fetchPosts();
      }, [user]);

      const replacePost = (updated) =>
        setPosts((prev) => prev.map((p) => (p.id === updated.id ? updated : p)));

      const handleCreate = async (category, title, content) => {
        await call('/api/posts', { method: 'POST', body: { category, title, content } });
        await fetchPosts();
      };

      const handleEdit = async (id, category, title, content) => {
        replacePost(await call(`/api/posts/${id}`, { method: 'PUT', body: { category, title, content } }));
      };

      const handleDelete = async (id) => {
        await call(`/api/posts/${id}`, { method: 'DELETE' });
        setPosts((prev) => prev.filter((p) => p.id !== id));
      };

      const handleLike = async (id) => {
        replacePost(await call(`/api/posts/${id}/like`, { method: 'PUT' }));
      };

      const handleCommentCount = (id, n) =>
        setPosts((prev) => prev.map((p) => (p.id === id && p.comment_count !== n ? { ...p, comment_count: n } : p)));

      const handleToggle = (id) => {
        setExpandedIds((prev) => {
          const next = new Set(prev);
          next.has(id) ? next.delete(id) : next.add(id);
          return next;
        });
      };

      const goView = (v) => {
        setView(v);
        setCategoryFilter('');
      };

      if (checking) return <p className="text-slate-400 text-center py-20">불러오는 중...</p>;
      if (!token || !user) return <AuthScreen onAuth={handleAuth} />;

      // 마이페이지면 내 글만, 그 안에서 카테고리 필터
      const scoped = view === 'mypage' ? posts.filter((p) => p.mine) : posts;
      const visible = categoryFilter ? scoped.filter((p) => p.category === categoryFilter) : scoped;
      const countOf = (c) => scoped.filter((p) => p.category === c).length;

      const catBtn = (value, label, count) => (
        <button
          key={value}
          onClick={() => setCategoryFilter(value)}
          className={`flex items-center justify-between gap-2 whitespace-nowrap px-3 py-1.5 rounded-lg text-sm md:w-full ${
            categoryFilter === value
              ? 'bg-indigo-600 text-white font-medium'
              : 'bg-white text-slate-600 border border-slate-200 hover:border-indigo-300'
          }`}
        >
          <span>{label}</span>
          <span className={`text-xs ${categoryFilter === value ? 'text-indigo-100' : 'text-slate-400'}`}>{count}</span>
        </button>
      );

      return (
        <div className="max-w-4xl mx-auto px-4 py-8">
          <div className="flex items-start justify-between mb-6">
            <button onClick={() => goView('home')} className="text-left">
              <h1 className="text-2xl font-bold text-slate-800 mb-1">🛍️ 살까말까 커뮤니티</h1>
              <p className="text-sm text-slate-400">살까 말까 고민될 때, 같이 고민해요.</p>
            </button>
            <div className="text-right text-sm shrink-0">
              <div className="text-slate-600 font-medium">{user.username}</div>
              <div className="flex gap-3 justify-end text-xs">
                <button
                  onClick={() => goView(view === 'mypage' ? 'home' : 'mypage')}
                  className={view === 'mypage' ? 'text-indigo-600 font-medium' : 'text-slate-400 hover:text-indigo-600'}
                >
                  {view === 'mypage' ? '전체 글 보기' : '마이페이지'}
                </button>
                <button onClick={logout} className="text-slate-400 hover:text-red-500">로그아웃</button>
              </div>
            </div>
          </div>

          <div className="md:flex md:gap-6 md:items-start">
            <aside className="md:w-44 md:shrink-0 mb-4 md:mb-0 md:sticky md:top-6">
              <div className="hidden md:block text-xs font-semibold text-slate-400 mb-2 px-1">카테고리</div>
              <nav className="flex md:flex-col gap-2 overflow-x-auto pb-1 md:pb-0">
                {catBtn('', '전체', scoped.length)}
                {CATEGORIES.map((c) => catBtn(c, c, countOf(c)))}
              </nav>
            </aside>

            <main className="flex-1 min-w-0">
              {view === 'mypage' ? (
                <div className="mb-4">
                  <h2 className="text-lg font-bold text-slate-800">📝 마이페이지 · 내가 쓴 글</h2>
                  <p className="text-xs text-slate-400">{user.username}님이 쓴 글 {scoped.length}개</p>
                </div>
              ) : (
                <PostForm onSubmit={handleCreate} defaultCategory={categoryFilter} />
              )}

              <div className="text-xs text-slate-400 mb-2">
                {categoryFilter ? `${categoryFilter} · ` : ''}최신순 · 글을 누르면 전체 내용과 댓글을 볼 수 있어요
              </div>

              {error && <div className="bg-red-50 text-red-600 text-sm rounded-lg px-4 py-2 mb-4">{error}</div>}

              {loading && posts.length === 0 ? (
                <p className="text-slate-400 text-center py-10">불러오는 중...</p>
              ) : visible.length === 0 ? (
                <p className="text-slate-400 text-center py-10">
                  {view === 'mypage' ? '아직 쓴 글이 없어요.' : '이 카테고리에는 아직 글이 없습니다. 첫 고민을 남겨보세요!'}
                </p>
              ) : (
                <div className="space-y-3">
                  {visible.map((post) => (
                    <PostCard
                      key={post.id}
                      post={post}
                      expanded={expandedIds.has(post.id)}
                      call={call}
                      onToggle={handleToggle}
                      onEdit={handleEdit}
                      onDelete={handleDelete}
                      onLike={handleLike}
                      onCommentCount={handleCommentCount}
                    />
                  ))}
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
