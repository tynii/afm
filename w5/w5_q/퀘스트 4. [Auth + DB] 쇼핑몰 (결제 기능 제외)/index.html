<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다향 - 차와 다구</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    body { background: #FAF6EE; color: #2E2A24; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .toast-in { animation: toast-in .2s ease-out; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState, useEffect, useMemo, useCallback, useContext, createContext } = React;

    const API_BASE_URL = '/api';
    const TOKEN_KEY = 'tea_shop_token';
    const CATEGORIES = [{ id: 'all', label: '전체' }, { id: 'tea', label: '차' }, { id: 'teaware', label: '다구' }];
    const won = (n) => `${Number(n).toLocaleString('ko-KR')}원`;

    // ========================================
    // 📡 API
    // ========================================
    async function api(path, { method = 'GET', body, token } = {}) {
      const res = await fetch(`${API_BASE_URL}${path}`, {
        method,
        headers: {
          ...(body ? { 'Content-Type': 'application/json' } : {}),
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
        },
        body: body ? JSON.stringify(body) : undefined,
      });
      let json = null;
      try { json = await res.json(); } catch {}
      if (!res.ok || !json || json.success === false) {
        const err = new Error((json && json.message) || '요청에 실패했습니다');
        err.status = res.status;
        throw err;
      }
      return json.data;
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ variant = 'primary', size = 'md', className = '', children, ...props }) {
      const variants = {
        primary: 'bg-emerald-800 text-white hover:bg-emerald-900',
        secondary: 'bg-white text-stone-700 border border-stone-300 hover:bg-stone-100',
        danger: 'bg-white text-red-600 border border-red-200 hover:bg-red-50',
        ghost: 'text-stone-600 hover:bg-stone-200/60',
      };
      const sizes = { sm: 'px-3 py-1.5 text-sm', md: 'px-4 py-2 text-sm', lg: 'px-5 py-3 text-base' };
      return (
        <button
          className={`inline-flex items-center justify-center gap-1 rounded-lg font-medium transition disabled:opacity-40 disabled:cursor-not-allowed focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-600 ${variants[variant]} ${sizes[size]} ${className}`}
          {...props}
        >{children}</button>
      );
    }

    function Input({ label, error, className = '', id, ...props }) {
      return (
        <label className="block" htmlFor={id}>
          {label && <span className="block text-sm font-medium text-stone-700 mb-1">{label}</span>}
          <input id={id}
            className={`w-full rounded-lg border px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600 ${error ? 'border-red-400' : 'border-stone-300'} ${className}`}
            {...props} />
          {error && <span className="block text-xs text-red-600 mt-1">{error}</span>}
        </label>
      );
    }

    function Card({ className = '', children }) {
      return <div className={`bg-white rounded-2xl shadow-sm border border-stone-200 ${className}`}>{children}</div>;
    }

    function Modal({ isOpen, onClose, title, children, footer }) {
      useEffect(() => {
        if (!isOpen) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [isOpen, onClose]);
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40" onClick={onClose}>
          <div role="dialog" aria-modal="true" aria-label={title} onClick={(e) => e.stopPropagation()}
            className="bg-white rounded-2xl shadow-xl w-full max-w-xs p-6 text-center">
            <h2 className="text-lg font-bold mb-2">{title}</h2>
            <div className="text-sm text-stone-600 mb-5">{children}</div>
            {footer || <Button className="w-full" onClick={onClose} autoFocus>확인</Button>}
          </div>
        </div>
      );
    }

    function Spinner() {
      return <div role="status" aria-label="로딩 중" className="mx-auto my-16 h-8 w-8 animate-spin rounded-full border-4 border-emerald-800 border-t-transparent" />;
    }

    function EmptyState({ icon, title, children }) {
      return (
        <div className="text-center py-16 text-stone-500">
          <div className="text-5xl mb-3" aria-hidden="true">{icon}</div>
          <p className="font-medium text-stone-700">{title}</p>
          <div className="mt-4">{children}</div>
        </div>
      );
    }

    // ========================================
    // 🔀 Router (hash)
    // ========================================
    function useHashRoute() {
      const get = () => window.location.hash.replace(/^#/, '') || '/';
      const [route, setRoute] = useState(get);
      useEffect(() => {
        const onChange = () => setRoute(get());
        window.addEventListener('hashchange', onChange);
        return () => window.removeEventListener('hashchange', onChange);
      }, []);
      return route;
    }
    const navigate = (to) => { window.location.hash = to; };
    function Link({ to, className = '', children, ...props }) {
      return <a href={`#${to}`} className={className} {...props}>{children}</a>;
    }

    // ========================================
    // 🔐 Auth / Cart Context
    // ========================================
    const ShopContext = createContext(null);
    const useShop = () => useContext(ShopContext);

    function ShopProvider({ children }) {
      const [token, setToken] = useState(() => { try { return localStorage.getItem(TOKEN_KEY); } catch { return null; } });
      const [user, setUser] = useState(null);
      const [authReady, setAuthReady] = useState(!token);
      const [cart, setCart] = useState([]);
      const [toast, setToast] = useState(null);

      const notify = useCallback((message) => {
        setToast({ message, id: Date.now() });
      }, []);
      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2200);
        return () => clearTimeout(t);
      }, [toast]);

      const logout = useCallback(() => {
        try { localStorage.removeItem(TOKEN_KEY); } catch {}
        setToken(null); setUser(null); setCart([]);
      }, []);

      // 저장된 토큰이 있으면 유효성 확인 + 장바구니 로드
      useEffect(() => {
        if (!token) { setAuthReady(true); return; }
        let cancelled = false;
        Promise.all([api('/auth/me', { token }), api('/cart', { token })])
          .then(([me, items]) => { if (!cancelled) { setUser(me); setCart(items); } })
          .catch(() => { if (!cancelled) logout(); })
          .finally(() => { if (!cancelled) setAuthReady(true); });
        return () => { cancelled = true; };
      }, [token]);

      const loginWith = useCallback((data) => {
        try { localStorage.setItem(TOKEN_KEY, data.token); } catch {}
        setUser(data.user);
        setAuthReady(false);
        setToken(data.token);
      }, []);

      // 장바구니 조작: 성공하면 서버가 돌려준 최신 장바구니로 교체
      const cartCall = useCallback(async (path, opts) => {
        try {
          const items = await api(path, { ...opts, token });
          setCart(items);
          return true;
        } catch (e) {
          if (e.status === 401) { logout(); navigate('/login'); }
          notify(e.message);
          return false;
        }
      }, [token, logout, notify]);

      const addToCart = useCallback(async (product) => {
        if (await cartCall('/cart', { method: 'POST', body: { productId: product.id } })) notify(`'${product.name}'을(를) 장바구니에 담았어요`);
      }, [cartCall, notify]);
      const setQuantity = useCallback((productId, quantity) => cartCall(`/cart/${productId}`, { method: 'PUT', body: { quantity } }), [cartCall]);
      const removeItem = useCallback((productId) => cartCall(`/cart/${productId}`, { method: 'DELETE' }), [cartCall]);

      const cartCount = cart.reduce((s, i) => s + i.quantity, 0);
      const value = { token, user, authReady, cart, cartCount, loginWith, logout, addToCart, setQuantity, removeItem, notify };

      return (
        <ShopContext.Provider value={value}>
          {children}
          {toast && (
            <div key={toast.id} role="status" className="toast-in fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-stone-900 text-white text-sm px-4 py-2.5 rounded-full shadow-lg max-w-[90vw]">
              {toast.message}
            </div>
          )}
        </ShopContext.Provider>
      );
    }

    // ========================================
    // 🧩 Layout
    // ========================================
    function Header() {
      const { user, cartCount, logout } = useShop();
      return (
        <header className="sticky top-0 z-40 bg-[#FAF6EE]/95 backdrop-blur border-b border-stone-200">
          <div className="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
            <Link to="/" className="text-xl font-bold text-emerald-900 tracking-tight">🍵 다향</Link>
            <nav className="flex items-center gap-1 text-sm">
              <Link to="/cart" className="relative px-3 py-2 rounded-lg hover:bg-stone-200/60 font-medium" aria-label={`장바구니, ${cartCount}개`}>
                장바구니
                {cartCount > 0 && <span className="ml-1 inline-flex items-center justify-center min-w-[1.25rem] h-5 px-1 rounded-full bg-emerald-800 text-white text-xs">{cartCount}</span>}
              </Link>
              {user ? (
                <>
                  <span className="hidden sm:inline text-stone-500 px-2">{user.username}님</span>
                  <Button variant="ghost" size="sm" onClick={() => { logout(); navigate('/'); }}>로그아웃</Button>
                </>
              ) : (
                <Link to="/login" className="px-3 py-2 rounded-lg bg-emerald-800 text-white hover:bg-emerald-900 font-medium">로그인</Link>
              )}
            </nav>
          </div>
        </header>
      );
    }

    // ========================================
    // 📄 Pages
    // ========================================
    function ProductsPage() {
      const { user, addToCart } = useShop();
      const [products, setProducts] = useState(null);
      const [error, setError] = useState('');
      const [busyId, setBusyId] = useState(null);
      const [category, setCategory] = useState('all');
      const [preparing, setPreparing] = useState(false);

      const load = useCallback(() => {
        setError(''); setProducts(null);
        api('/products').then(setProducts).catch((e) => setError(e.message));
      }, []);
      useEffect(load, [load]);

      const visible = useMemo(() => (products || []).filter((p) => category === 'all' || p.category === category), [products, category]);

      const onAdd = async (p) => {
        if (!user) { navigate('/login?next=/'); return; }
        setBusyId(p.id);
        await addToCart(p);
        setBusyId(null);
      };

      return (
        <main className="max-w-5xl mx-auto px-4 py-8">
          <div className="mb-8">
            <h1 className="text-2xl sm:text-3xl font-bold text-emerald-950">차와 다구</h1>
            <p className="text-stone-600 mt-1">좋은 차 한 잔을 위한 잎차와 도구들</p>
          </div>
          <div className="flex gap-2 mb-6" role="tablist" aria-label="카테고리">
            {CATEGORIES.map((c) => (
              <button key={c.id} role="tab" aria-selected={category === c.id} onClick={() => setCategory(c.id)}
                className={`px-4 py-2 rounded-full text-sm font-medium border transition ${category === c.id ? 'bg-emerald-800 text-white border-emerald-800' : 'bg-white text-stone-600 border-stone-300 hover:bg-stone-100'}`}>
                {c.label}
              </button>
            ))}
          </div>
          {error ? (
            <EmptyState icon="⚠️" title={error}><Button onClick={load}>다시 시도</Button></EmptyState>
          ) : !products ? <Spinner /> : visible.length === 0 ? (
            <EmptyState icon="🍃" title="등록된 상품이 없어요" />
          ) : (
            <ul className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
              {visible.map((p) => (
                <li key={p.id}>
                  <Card className="overflow-hidden h-full flex flex-col">
                    <button type="button" onClick={() => setPreparing(true)} aria-label={`${p.name} 상세 보기`} className="block text-left">
                      <img src={p.image_url} alt={p.name} loading="lazy" className="w-full aspect-[4/3] object-cover bg-stone-200" />
                    </button>
                    <div className="p-4 flex flex-col flex-1">
                      <h2 className="font-semibold text-lg"><button type="button" onClick={() => setPreparing(true)} className="text-left hover:underline">{p.name}</button></h2>
                      <p className="text-sm text-stone-600 mt-1 flex-1">{p.description}</p>
                      <div className="mt-4 flex items-center justify-between">
                        <span className="text-lg font-bold text-emerald-900">{won(p.price)}</span>
                        <Button size="sm" onClick={() => onAdd(p)} disabled={busyId === p.id}>
                          {busyId === p.id ? '담는 중…' : '장바구니 담기'}
                        </Button>
                      </div>
                    </div>
                  </Card>
                </li>
              ))}
            </ul>
          )}
          <Modal isOpen={preparing} onClose={() => setPreparing(false)} title="준비중">상세 페이지는 준비중입니다.</Modal>
        </main>
      );
    }

    function AuthPage({ route }) {
      const { user, loginWith } = useShop();
      const next = useMemo(() => new URLSearchParams(route.split('?')[1] || '').get('next') || '/cart', [route]);
      const [mode, setMode] = useState('login');
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      useEffect(() => { if (user) navigate(next); }, [user]);

      const submit = async (e) => {
        e.preventDefault();
        setError(''); setLoading(true);
        try {
          const data = await api(`/auth/${mode === 'login' ? 'login' : 'signup'}`, { method: 'POST', body: { username, password } });
          loginWith(data);
        } catch (err) { setError(err.message); }
        finally { setLoading(false); }
      };

      return (
        <main className="max-w-sm mx-auto px-4 py-12">
          <Card className="p-6">
            <h1 className="text-xl font-bold mb-1">{mode === 'login' ? '로그인' : '회원가입'}</h1>
            <p className="text-sm text-stone-500 mb-5">장바구니를 이용하려면 로그인이 필요해요.</p>
            <form onSubmit={submit} className="space-y-4">
              <Input id="username" label="아이디" value={username} onChange={(e) => setUsername(e.target.value)} autoComplete="username" required />
              <Input id="password" label="비밀번호" type="password" value={password} onChange={(e) => setPassword(e.target.value)}
                autoComplete={mode === 'login' ? 'current-password' : 'new-password'} required />
              {error && <p role="alert" className="text-sm text-red-600">{error}</p>}
              <Button type="submit" size="lg" className="w-full" disabled={loading}>
                {loading ? '처리 중…' : mode === 'login' ? '로그인' : '가입하고 시작하기'}
              </Button>
            </form>
            <button type="button" className="mt-4 text-sm text-emerald-800 hover:underline"
              onClick={() => { setMode(mode === 'login' ? 'signup' : 'login'); setError(''); }}>
              {mode === 'login' ? '계정이 없나요? 회원가입' : '이미 계정이 있나요? 로그인'}
            </button>
          </Card>
        </main>
      );
    }

    function CartPage() {
      const { user, authReady, cart, setQuantity, removeItem } = useShop();
      const [selected, setSelected] = useState(() => new Set());
      const [seen, setSeen] = useState(() => new Set());
      const [busy, setBusy] = useState(false);
      const [preparing, setPreparing] = useState(false);
      const [deleting, setDeleting] = useState(null);

      // 로그인 필수
      useEffect(() => { if (authReady && !user) navigate('/login?next=/cart'); }, [authReady, user]);

      // 새로 들어온 상품은 기본 선택 상태로
      useEffect(() => {
        const fresh = cart.filter((i) => !seen.has(i.product_id));
        if (fresh.length) {
          setSeen((s) => new Set([...s, ...fresh.map((i) => i.product_id)]));
          setSelected((s) => new Set([...s, ...fresh.map((i) => i.product_id)]));
        }
      }, [cart]);

      const toggle = (id) => setSelected((s) => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
      const allSelected = cart.length > 0 && cart.every((i) => selected.has(i.product_id));
      const toggleAll = () => setSelected(allSelected ? new Set() : new Set(cart.map((i) => i.product_id)));

      const { total, count } = useMemo(() => {
        const picked = cart.filter((i) => selected.has(i.product_id));
        return { total: picked.reduce((s, i) => s + i.price * i.quantity, 0), count: picked.length };
      }, [cart, selected]);

      const run = async (fn) => { setBusy(true); await fn(); setBusy(false); };

      if (!authReady || !user) return <main className="max-w-3xl mx-auto px-4"><Spinner /></main>;

      return (
        <main className="max-w-3xl mx-auto px-4 py-8">
          <h1 className="text-2xl font-bold text-emerald-950 mb-6">장바구니</h1>
          {cart.length === 0 ? (
            <EmptyState icon="🧺" title="장바구니가 비어 있어요">
              <Link to="/" className="inline-block px-4 py-2 rounded-lg bg-emerald-800 text-white text-sm font-medium hover:bg-emerald-900">상품 둘러보기</Link>
            </EmptyState>
          ) : (
            <>
              <label className="flex items-center gap-2 text-sm text-stone-600 mb-3 cursor-pointer w-fit">
                <input type="checkbox" className="h-4 w-4 accent-emerald-800" checked={allSelected} onChange={toggleAll} />
                전체 선택 ({selected.size}/{cart.length})
              </label>
              <ul className="space-y-3">
                {cart.map((item) => {
                  const checked = selected.has(item.product_id);
                  return (
                    <li key={item.product_id}>
                      <Card className={`p-3 sm:p-4 flex gap-3 items-center ${checked ? '' : 'opacity-60'}`}>
                        <input type="checkbox" className="h-4 w-4 accent-emerald-800 shrink-0" checked={checked}
                          onChange={() => toggle(item.product_id)} aria-label={`${item.name} 선택`} />
                        <img src={item.image_url} alt={item.name} className="w-16 h-16 sm:w-20 sm:h-20 rounded-lg object-cover bg-stone-200 shrink-0" />
                        <div className="flex-1 min-w-0">
                          <p className="font-semibold truncate">{item.name}</p>
                          <p className="text-sm text-stone-500">{won(item.price)}</p>
                          <div className="mt-2 flex items-center gap-2">
                            <button type="button" aria-label="수량 줄이기" disabled={busy || item.quantity <= 1}
                              onClick={() => run(() => setQuantity(item.product_id, item.quantity - 1))}
                              className="h-8 w-8 rounded-lg border border-stone-300 hover:bg-stone-100 disabled:opacity-40 disabled:cursor-not-allowed">−</button>
                            <span className="w-8 text-center font-medium tabular-nums" aria-live="polite">{item.quantity}</span>
                            <button type="button" aria-label="수량 늘리기" disabled={busy || item.quantity >= 99}
                              onClick={() => run(() => setQuantity(item.product_id, item.quantity + 1))}
                              className="h-8 w-8 rounded-lg border border-stone-300 hover:bg-stone-100 disabled:opacity-40 disabled:cursor-not-allowed">+</button>
                          </div>
                        </div>
                        <div className="text-right shrink-0">
                          <p className="font-bold text-emerald-900 tabular-nums">{won(item.price * item.quantity)}</p>
                          <Button variant="danger" size="sm" className="mt-2" disabled={busy}
                            onClick={() => setDeleting(item)}>삭제</Button>
                        </div>
                      </Card>
                    </li>
                  );
                })}
              </ul>
              <Card className="mt-6 p-5 flex items-center justify-between">
                <span className="text-stone-600">선택 상품 {count}종 합계</span>
                <span className="text-2xl font-bold text-emerald-900 tabular-nums" aria-live="polite">{won(total)}</span>
              </Card>
              <div className="mt-4 grid grid-cols-2 gap-3">
                <Button variant="secondary" size="lg" onClick={() => setPreparing(true)}>전체 상품 주문하기</Button>
                <Button size="lg" disabled={count === 0} onClick={() => setPreparing(true)}>선택 상품 주문하기</Button>
              </div>
              <Modal isOpen={!!deleting} onClose={() => setDeleting(null)} title="삭제하시겠습니까?"
                footer={
                  <div className="grid grid-cols-2 gap-2">
                    <Button variant="secondary" onClick={() => setDeleting(null)} autoFocus>취소</Button>
                    <Button onClick={async () => { const id = deleting.product_id; setDeleting(null); await run(() => removeItem(id)); }} className="!bg-red-600 hover:!bg-red-700">삭제</Button>
                  </div>
                }>
                {deleting && `'${deleting.name}'을(를) 장바구니에서 삭제합니다.`}
              </Modal>
              <Modal isOpen={preparing} onClose={() => setPreparing(false)} title="준비중">주문 기능은 준비중입니다.</Modal>
            </>
          )}
        </main>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      const route = useHashRoute();
      const path = route.split('?')[0];
      let page;
      if (path === '/login') page = <AuthPage route={route} />;
      else if (path === '/cart') page = <CartPage />;
      else page = <ProductsPage />;
      return (
        <>
          <Header />
          {page}
          <footer className="text-center text-xs text-stone-400 py-8">© 다향 · 차와 다구</footer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ShopProvider><App /></ShopProvider>);
  </script>
</body>
</html>
