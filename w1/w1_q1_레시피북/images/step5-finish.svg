<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <rect width="400" height="260" fill="#FFF8F0"/>
  <!-- bowl -->
  <path d="M90,150 Q90,215 200,215 Q310,215 310,150 Z" fill="#5C7C8A"/>
  <path d="M90,150 Q90,210 200,210 Q310,210 310,150 Z" fill="#7B9CAB"/>
  <ellipse cx="200" cy="150" rx="110" ry="26" fill="#8FB3C2"/>
  <ellipse cx="200" cy="150" rx="95" ry="20" fill="#4A4A4A"/>
  <!-- rice mound -->
  <g fill="#FFF3D6" stroke="#E0C896" stroke-width="1.5">
    <ellipse cx="160" cy="142" rx="7" ry="4"/>
    <ellipse cx="180" cy="150" rx="7" ry="4"/>
    <ellipse cx="200" cy="138" rx="7" ry="4"/>
    <ellipse cx="220" cy="148" rx="7" ry="4"/>
    <ellipse cx="240" cy="140" rx="7" ry="4"/>
    <ellipse cx="170" cy="158" rx="7" ry="4"/>
    <ellipse cx="195" cy="155" rx="7" ry="4"/>
    <ellipse cx="220" cy="158" rx="7" ry="4"/>
  </g>
  <!-- fried egg on top -->
  <ellipse cx="200" cy="132" rx="34" ry="20" fill="white" stroke="#EEE6D8" stroke-width="2"/>
  <circle cx="200" cy="132" r="14" fill="#FFC940" stroke="#F2A900" stroke-width="2"/>
  <!-- sesame + green onion garnish -->
  <g fill="#8BC34A">
    <circle cx="150" cy="130" r="3"/>
    <circle cx="245" cy="128" r="3"/>
    <circle cx="165" cy="118" r="3"/>
  </g>
  <g fill="#3A3A3A">
    <circle cx="175" cy="112" r="2"/>
    <circle cx="225" cy="114" r="2"/>
    <circle cx="205" cy="105" r="2"/>
  </g>
  <!-- chopsticks -->
  <g transform="rotate(20 330 90)">
    <rect x="325" y="40" width="7" height="110" rx="3" fill="#8D6E63"/>
    <rect x="338" y="40" width="7" height="110" rx="3" fill="#8D6E63"/>
  </g>
  <!-- title badge -->
  <circle cx="40" cy="40" r="26" fill="#FF8C42"/>
  <text x="40" y="49" font-family="Arial, sans-serif" font-size="26" fill="white" text-anchor="middle" font-weight="bold">5</text>
</svg>
