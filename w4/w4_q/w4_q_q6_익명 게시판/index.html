<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>익명 고민/칭찬 게시판</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const API_BASE_URL = '/api/posts';
    const BEST_THRESHOLD = 10;

    const CATEGORIES = [
      { value: '고민', label: '😥 고민', badge: 'bg-amber-100 text-amber-700 border-amber-200' },
      { value: '칭찬', label: '👏 칭찬', badge: 'bg-pink-100 text-pink-700 border-pink-200' },
      { value: '응원', label: '💪 응원', badge: 'bg-emerald-100 text-emerald-700 border-emerald-200' },
    ];

    function categoryMeta(value) {
      return CATEGORIES.find((c) => c.value === value) || CATEGORIES[0];
    }

    function getClientId() {
      const KEY = 'anonBoardClientId';
      let id = localStorage.getItem(KEY);
      if (!id) {
        id = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`);
        localStorage.setItem(KEY, id);
      }
      return id;
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleString('ko-KR', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit',
      });
    }

    function PostForm({ onSubmit }) {
      const [category, setCategory] = useState(CATEGORIES[0].value);
      const [content, setContent] = useState('');
      const [saving, setSaving] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!content.trim()) return;
        setSaving(true);
        try {
          await onSubmit({ category, content: content.trim() });
          setContent('');
        } finally {
          setSaving(false);
        }
      };

      return (
        <form onSubmit={handleSubmit} className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6 space-y-3">
          <div className="flex gap-2">
            {CATEGORIES.map((c) => (
              <button
                type="button"
                key={c.value}
                onClick={() => setCategory(c.value)}
                className={`px-3 py-1.5 rounded-full text-sm font-medium border transition ${
                  category === c.value ? c.badge : 'bg-slate-50 text-slate-400 border-slate-200'
                }`}
              >
                {c.label}
              </button>
            ))}
          </div>
          <textarea
            value={content}
            onChange={(e) => setContent(e.target.value)}
            placeholder="익명으로 남길 이야기를 적어주세요..."
            rows={3}
            className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-none"
          />
          <div className="flex justify-end">
            <button
              type="submit"
              disabled={saving || !content.trim()}
              className="px-4 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed"
            >
              {saving ? '등록 중...' : '익명으로 등록'}
            </button>
          </div>
        </form>
      );
    }

    function LikeButton({ liked, likes, onToggle }) {
      const [busy, setBusy] = useState(false);
      return (
        <button
          disabled={busy}
          onClick={async () => {
            setBusy(true);
            try {
              await onToggle();
            } finally {
              setBusy(false);
            }
          }}
          className={`flex items-center gap-1 text-sm font-medium rounded-lg px-3 py-1.5 disabled:opacity-50 ${
            liked ? 'text-rose-600 bg-rose-50' : 'text-rose-500 hover:bg-rose-50'
          }`}
        >
          {liked ? '❤️' : '🤍'} 공감 {likes}
        </button>
      );
    }

    function ReplyItem({ reply, onEdit, onDelete, onLike }) {
      const [editing, setEditing] = useState(false);
      const [content, setContent] = useState(reply.content);
      const [saving, setSaving] = useState(false);

      if (editing) {
        return (
          <div className="bg-slate-50 rounded-lg p-3 space-y-2">
            <textarea
              value={content}
              onChange={(e) => setContent(e.target.value)}
              rows={2}
              className="w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-none"
            />
            <div className="flex justify-end gap-2">
              <button onClick={() => setEditing(false)} className="text-xs text-slate-400 hover:bg-slate-100 rounded px-2 py-1">
                취소
              </button>
              <button
                disabled={saving || !content.trim()}
                onClick={async () => {
                  setSaving(true);
                  try {
                    await onEdit(reply.id, content.trim());
                    setEditing(false);
                  } finally {
                    setSaving(false);
                  }
                }}
                className="text-xs text-white bg-indigo-600 hover:bg-indigo-700 rounded px-2 py-1 disabled:opacity-50"
              >
                {saving ? '저장 중...' : '저장'}
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="bg-slate-50 rounded-lg p-3 flex flex-col gap-1.5">
          <div className="flex items-start justify-between gap-2">
            <p className="text-sm text-slate-600 whitespace-pre-wrap break-words">{reply.content}</p>
            {reply.mine && (
              <div className="flex gap-1 shrink-0">
                <button onClick={() => setEditing(true)} className="text-xs text-slate-400 hover:bg-slate-200 rounded px-2 py-1">
                  수정
                </button>
                <button
                  onClick={() => {
                    if (confirm('이 답글을 삭제할까요?')) onDelete(reply.id);
                  }}
                  className="text-xs text-red-400 hover:bg-red-50 rounded px-2 py-1"
                >
                  삭제
                </button>
              </div>
            )}
          </div>
          <div className="flex items-center justify-between">
            <span className="text-[11px] text-slate-400">{formatDate(reply.created_at)}</span>
            <LikeButton liked={reply.liked} likes={reply.likes} onToggle={() => onLike(reply.id)} />
          </div>
        </div>
      );
    }

    function PostCard({ post, expanded, replies, repliesLoading, onToggleExpand, onEdit, onDelete, onLike, onReplyCreate, onReplyEdit, onReplyDelete, onReplyLike }) {
      const [editing, setEditing] = useState(false);
      const [category, setCategory] = useState(post.category);
      const [content, setContent] = useState(post.content);
      const [saving, setSaving] = useState(false);
      const [replyText, setReplyText] = useState('');
      const [replySaving, setReplySaving] = useState(false);
      const meta = categoryMeta(post.category);

      const handleReplySubmit = async (e) => {
        e.preventDefault();
        if (!replyText.trim()) return;
        setReplySaving(true);
        try {
          await onReplyCreate(post.id, replyText.trim());
          setReplyText('');
        } finally {
          setReplySaving(false);
        }
      };

      return (
        <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col gap-2">
          {editing ? (
            <div className="space-y-2">
              <div className="flex gap-2">
                {CATEGORIES.map((c) => (
                  <button
                    type="button"
                    key={c.value}
                    onClick={() => setCategory(c.value)}
                    className={`px-2.5 py-1 rounded-full text-xs font-medium border ${
                      category === c.value ? c.badge : 'bg-slate-50 text-slate-400 border-slate-200'
                    }`}
                  >
                    {c.label}
                  </button>
                ))}
              </div>
              <textarea
                value={content}
                onChange={(e) => setContent(e.target.value)}
                rows={3}
                className="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-none"
              />
              <div className="flex justify-end gap-2">
                <button onClick={() => setEditing(false)} className="text-sm text-slate-400 hover:bg-slate-100 rounded-lg px-3 py-1.5">
                  취소
                </button>
                <button
                  disabled={saving || !content.trim()}
                  onClick={async () => {
                    setSaving(true);
                    try {
                      await onEdit(post.id, { category, content: content.trim() });
                      setEditing(false);
                    } finally {
                      setSaving(false);
                    }
                  }}
                  className="text-sm text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg px-3 py-1.5 disabled:opacity-50"
                >
                  {saving ? '저장 중...' : '저장'}
                </button>
              </div>
            </div>
          ) : (
            <>
              <div className="flex items-center justify-between gap-2">
                <span className={`text-xs font-semibold px-2.5 py-1 rounded-full border ${meta.badge}`}>
                  {meta.label}
                </span>
                <div className="flex items-center gap-2">
                  <span className="text-xs text-slate-400">{formatDate(post.created_at)}</span>
                  {post.mine && (
                    <div className="flex gap-1">
                      <button onClick={() => setEditing(true)} className="text-xs text-slate-400 hover:bg-slate-100 rounded px-2 py-1">
                        수정
                      </button>
                      <button
                        onClick={() => {
                          if (confirm('이 글을 삭제할까요?')) onDelete(post.id);
                        }}
                        className="text-xs text-red-400 hover:bg-red-50 rounded px-2 py-1"
                      >
                        삭제
                      </button>
                    </div>
                  )}
                </div>
              </div>
              <p className="text-slate-700 whitespace-pre-wrap break-words text-sm">{post.content}</p>
            </>
          )}

          <div className="flex items-center justify-between pt-1">
            <button
              onClick={() => onToggleExpand(post.id)}
              className="text-sm text-slate-400 hover:bg-slate-100 rounded-lg px-3 py-1.5"
            >
              💬 답글 {post.reply_count}
            </button>
            <LikeButton liked={post.liked} likes={post.likes} onToggle={() => onLike(post.id)} />
          </div>

          {expanded && (
            <div className="border-t border-slate-100 mt-1 pt-3 space-y-2">
              {repliesLoading ? (
                <p className="text-xs text-slate-400 text-center py-2">답글 불러오는 중...</p>
              ) : replies.length === 0 ? (
                <p className="text-xs text-slate-400 text-center py-2">아직 답글이 없습니다.</p>
              ) : (
                replies.map((r) => (
                  <ReplyItem
                    key={r.id}
                    reply={r}
                    onEdit={(id, text) => onReplyEdit(post.id, id, text)}
                    onDelete={(id) => onReplyDelete(post.id, id)}
                    onLike={(id) => onReplyLike(post.id, id)}
                  />
                ))
              )}
              <form onSubmit={handleReplySubmit} className="flex gap-2 pt-1">
                <input
                  value={replyText}
                  onChange={(e) => setReplyText(e.target.value)}
                  placeholder="답글을 남겨보세요..."
                  className="flex-1 px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                />
                <button
                  type="submit"
                  disabled={replySaving || !replyText.trim()}
                  className="text-sm text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg px-3 py-1.5 disabled:opacity-50"
                >
                  등록
                </button>
              </form>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [clientId] = useState(getClientId);
      const [posts, setPosts] = useState([]);
      const [mode, setMode] = useState('latest'); // 'latest' | 'likes' | 'best'
      const [categoryFilter, setCategoryFilter] = useState('');
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');
      const [expandedIds, setExpandedIds] = useState(() => new Set());
      const [repliesMap, setRepliesMap] = useState({});

      const fetchPosts = useCallback(async () => {
        setLoading(true);
        setError('');
        try {
          const url = mode === 'best'
            ? `${API_BASE_URL}/best?clientId=${encodeURIComponent(clientId)}`
            : `${API_BASE_URL}?sort=${mode}&clientId=${encodeURIComponent(clientId)}`;
          const res = await fetch(url);
          const json = await res.json();
          if (!json.success) throw new Error(json.message || '조회 실패');
          setPosts(json.data);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      }, [mode, clientId]);

      useEffect(() => {
        fetchPosts();
      }, [fetchPosts]);

      const fetchReplies = useCallback(async (postId) => {
        setRepliesMap((prev) => ({ ...prev, [postId]: { loading: true, data: prev[postId]?.data || [] } }));
        try {
          const res = await fetch(`${API_BASE_URL}/${postId}/replies?clientId=${encodeURIComponent(clientId)}`);
          const json = await res.json();
          if (!json.success) throw new Error(json.message);
          setRepliesMap((prev) => ({ ...prev, [postId]: { loading: false, data: json.data } }));
        } catch (err) {
          setRepliesMap((prev) => ({ ...prev, [postId]: { loading: false, data: [] } }));
        }
      }, [clientId]);

      const handleToggleExpand = (postId) => {
        setExpandedIds((prev) => {
          const next = new Set(prev);
          if (next.has(postId)) {
            next.delete(postId);
          } else {
            next.add(postId);
            fetchReplies(postId);
          }
          return next;
        });
      };

      const handleCreate = async (data) => {
        const res = await fetch(API_BASE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...data, clientId }),
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.message || '등록 실패');
        fetchPosts();
      };

      const handleEdit = async (id, data) => {
        const res = await fetch(`${API_BASE_URL}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...data, clientId }),
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.message || '수정 실패');
        fetchPosts();
      };

      const handleDelete = async (id) => {
        const res = await fetch(`${API_BASE_URL}/${id}?clientId=${encodeURIComponent(clientId)}`, { method: 'DELETE' });
        const json = await res.json();
        if (!json.success) throw new Error(json.message || '삭제 실패');
        fetchPosts();
      };

      const handleLike = async (id) => {
        const res = await fetch(`${API_BASE_URL}/${id}/like`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clientId }),
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.message || '공감 실패');
        fetchPosts();
      };

      const handleReplyCreate = async (postId, content) => {
        const res = await fetch(`${API_BASE_URL}/${postId}/replies`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content, clientId }),
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.message || '답글 등록 실패');
        await fetchReplies(postId);
        fetchPosts();
      };

      const handleReplyEdit = async (postId, replyId, content) => {
        const res = await fetch(`/api/replies/${replyId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content, clientId }),
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.message || '답글 수정 실패');
        fetchReplies(postId);
      };

      const handleReplyDelete = async (postId, replyId) => {
        const res = await fetch(`/api/replies/${replyId}?clientId=${encodeURIComponent(clientId)}`, { method: 'DELETE' });
        const json = await res.json();
        if (!json.success) throw new Error(json.message || '답글 삭제 실패');
        await fetchReplies(postId);
        fetchPosts();
      };

      const handleReplyLike = async (postId, replyId) => {
        const res = await fetch(`/api/replies/${replyId}/like`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clientId }),
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.message || '공감 실패');
        fetchReplies(postId);
      };

      const displayedPosts = categoryFilter ? posts.filter((p) => p.category === categoryFilter) : posts;

      return (
        <div className="max-w-2xl mx-auto px-4 py-10">
          <h1 className="text-2xl font-bold text-slate-800 mb-1">🙊 익명 고민/칭찬 게시판</h1>
          <p className="text-sm text-slate-400 mb-6">누가 썼는지 몰라도, 마음은 전해져요.</p>

          <PostForm onSubmit={handleCreate} />

          <div className="flex flex-wrap items-center gap-2 mb-3">
            <button
              onClick={() => setMode('latest')}
              className={`px-3 py-1.5 rounded-lg text-sm font-medium ${
                mode === 'latest' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-500 border border-slate-200'
              }`}
            >
              최신순
            </button>
            <button
              onClick={() => setMode('likes')}
              className={`px-3 py-1.5 rounded-lg text-sm font-medium ${
                mode === 'likes' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-500 border border-slate-200'
              }`}
            >
              공감순
            </button>
            <button
              onClick={() => setMode('best')}
              className={`px-3 py-1.5 rounded-lg text-sm font-medium ${
                mode === 'best' ? 'bg-amber-500 text-white' : 'bg-white text-slate-500 border border-slate-200'
              }`}
            >
              🏆 베스트 (공감 {BEST_THRESHOLD}+)
            </button>
          </div>

          <div className="flex flex-wrap items-center gap-2 mb-4">
            <button
              onClick={() => setCategoryFilter('')}
              className={`px-3 py-1 rounded-full text-xs font-medium border ${
                categoryFilter === '' ? 'bg-slate-700 text-white border-slate-700' : 'bg-white text-slate-400 border-slate-200'
              }`}
            >
              전체
            </button>
            {CATEGORIES.map((c) => (
              <button
                key={c.value}
                onClick={() => setCategoryFilter(c.value)}
                className={`px-3 py-1 rounded-full text-xs font-medium border ${
                  categoryFilter === c.value ? c.badge : 'bg-white text-slate-400 border-slate-200'
                }`}
              >
                {c.label}
              </button>
            ))}
          </div>

          {error && (
            <div className="bg-red-50 text-red-600 text-sm rounded-lg px-4 py-2 mb-4">{error}</div>
          )}

          {loading ? (
            <p className="text-slate-400 text-center py-10">불러오는 중...</p>
          ) : displayedPosts.length === 0 ? (
            <p className="text-slate-400 text-center py-10">
              {mode === 'best' ? '아직 베스트 게시글이 없습니다.' : '아직 글이 없습니다. 첫 글을 남겨보세요!'}
            </p>
          ) : (
            <div className="space-y-3">
              {displayedPosts.map((post) => (
                <PostCard
                  key={post.id}
                  post={post}
                  expanded={expandedIds.has(post.id)}
                  replies={repliesMap[post.id]?.data || []}
                  repliesLoading={repliesMap[post.id]?.loading || false}
                  onToggleExpand={handleToggleExpand}
                  onEdit={handleEdit}
                  onDelete={handleDelete}
                  onLike={handleLike}
                  onReplyCreate={handleReplyCreate}
                  onReplyEdit={handleReplyEdit}
                  onReplyDelete={handleReplyDelete}
                  onReplyLike={handleReplyLike}
                />
              ))}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
